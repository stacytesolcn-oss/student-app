<style>
:root{--bg:#F6F1E7;--card:#FCFAF5;--ink:#231815;--muted:#6E5C52;--line:#E3D9C8;--brown:#643A24;--on-brown:#F6F1E7;--butter-soft:#FAF0CF}
@media (prefers-color-scheme: dark){:root{--bg:#231815;--card:#2E211C;--ink:#F3ECDF;--muted:#BCA995;--line:#46352C;--brown:#F4DC96;--on-brown:#231815;--butter-soft:#3F3422}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "DM Sans",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.back{color:var(--muted);font-size:.9rem;text-decoration:none}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.3rem;line-height:1.1;margin:0}
.how{background:var(--butter-soft);border-radius:18px;padding:12px 16px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.card h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.6rem;margin:0}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.dl{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:var(--brown);color:var(--on-brown);font-weight:700;text-decoration:none}
</style></head><body>
