<style>

@media (prefers-color-scheme: dark){ :root{
  --bg:#231815; --card:#2E211C; --ink:#F3ECDF; --muted:#BCA995; --line:#46352C;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.back{color:var(--muted);font-size:.9rem;text-decoration:none}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.7rem}
p{margin:0}
.eyebrow{font-family:var(--caps);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;min-height:48px;font-weight:700;padding:6px}
.tabs button.on{border-color:var(--brown);background:var(--brown);color:var(--on-brown)}
.tabs button.fin:not(.on){border-color:var(--good);color:var(--good)}
.how{background:var(--butter-soft);border-radius:18px;padding:12px 16px;font-size:.98rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;display:grid;gap:16px}
.count{font-family:var(--caps);font-size:.78rem;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);border-radius:3px;transition:width .3s}
.sent{font-size:1.25rem;line-height:1.5}
.wrongv{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:0 5px;text-decoration:line-through;text-decoration-thickness:1.5px}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--muted);text-align:center}
.fill{background:var(--good-soft);color:var(--good);border-radius:6px;padding:0 5px;font-weight:700}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.opt{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.1rem;font-weight:600;padding:10px 14px;text-align:center;touch-action:manipulation}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.wrong[disabled]{opacity:.7}
.fb{border-radius:14px;padding:10px 14px;font-weight:600}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px}
.nav button{flex:1;min-height:52px;border-radius:999px;font-weight:700;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown)}
.nav button.ghost{flex:0 0 auto;padding:0 18px;background:transparent;color:var(--ink);border-color:var(--line)}
.nav button[disabled]{opacity:.4;cursor:default}
.done{display:grid;gap:10px;text-align:center;padding:6px 0}
.done b{font-family:var(--display);font-size:1.6rem}
.qs{display:grid;gap:10px;margin:0;padding-left:1.3em;font-size:1.15rem}
.stems{background:var(--blue-soft);color:var(--blue-ink);border-radius:16px;padding:12px 16px;display:grid;gap:4px;font-size:1.05rem}
.stems b{font-family:var(--caps);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.tick{min-height:56px;border-radius:16px;border:1.5px solid var(--brown);background:transparent;color:var(--ink);font-weight:700;font-size:1.02rem;padding:10px 14px}
.tick.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.primary{width:100%;min-height:56px;border-radius:999px;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);font-weight:700;font-size:1.05rem}
.hw-sent{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:14px;padding:12px 14px;text-align:center}
.note{color:var(--muted);font-size:.92rem;text-align:center}

.pop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(35,24,21,.35);padding:24px}
.pop[hidden]{display:none}
.pop .in{background:var(--card);border-radius:26px;padding:20px 22px 22px;display:grid;justify-items:center;gap:10px;max-width:300px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.4,.4,1) both}
.pop img{width:150px;height:150px;object-fit:cover;border-radius:50%;background:var(--butter-soft);animation:wiggle 1.2s ease-in-out .35s 2}
.pop b{font-family:var(--display);font-size:1.7rem;line-height:1.1;text-align:center}
.pop button{min-height:48px;border-radius:999px;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);font-weight:700;padding:0 26px}
@keyframes popin{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){.pop .in,.pop img{animation:none}}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts button{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;min-height:60px;font-weight:700;padding:8px;line-height:1.25}
.parts button small{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.parts button.on{background:var(--butter);border-color:var(--brown);color:#231815}
.parts button.on small{color:#4a3a30}
.tabs button{font-size:.92rem}
.inp{font:inherit;font-size:1.1rem;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:52px;background:var(--bg);color:var(--ink)}
.inp:disabled{opacity:.8}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.check{min-height:52px;border-radius:999px;border:1.5px solid var(--brown);background:transparent;color:var(--ink);font-weight:700}
.check[disabled]{opacity:.4}
.hintw{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--butter-soft);border-radius:6px;padding:0 6px;white-space:nowrap}
.vtab{width:100%;border-collapse:collapse;font-size:.95rem}
.vtab td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.vtab td:first-child{font-weight:700;color:var(--brown);white-space:nowrap;width:5.5em}
.vtab .chips span{display:inline-block;background:var(--good-soft);color:var(--good);border-radius:8px;padding:1px 7px;margin:2px 4px 2px 0}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbtns .opt{min-height:50px;font-size:1rem}
.multi .opt.sel{border-color:var(--brown);background:var(--butter-soft)}
.play{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:18px;border:1.5px solid var(--brown);background:var(--butter-soft);color:var(--ink);font-weight:700;font-size:1.1rem}
.play.sm{min-height:48px;justify-content:flex-start;padding:0 14px;font-size:1rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;padding:6px 12px}
.tile[disabled]{opacity:.25}
.line{min-height:56px;border:1.5px dashed var(--muted);border-radius:14px;padding:8px 10px;font-size:1.1rem}
.profile{background:var(--blue-soft);color:var(--blue-ink);border-radius:16px;padding:12px 16px;display:grid;gap:2px}
.profile b{font-size:1.1rem}
.small{font-size:.92rem;color:var(--muted)}
.btn.primary[disabled]{opacity:.4;cursor:default}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = t => String(t).trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ").replace(/[.!?,]+$/, "");
const words = s => s.split(" ");

function newState(ex) {
  if (ex.type === "write") return ex.items.map(() => ({ text: "" }));
  if (ex.type === "final") return [{ hint: false }];
  return ex.items.map(it => {
    if (ex.type === "mcq") return { order: it.c ? VERBS.slice() : shuffle([it.a].concat(it.d)), tries: [], ok: false, shown: false };
    if (ex.type === "multi") return { order: shuffle(it.opts.map((o, k) => k)), sel: [], tries: [], ok: false, shown: false };
    if (ex.type === "type") return { val: "", tries: [], ok: false, shown: false };
    if (ex.type === "order") return { tiles: shuffle(words(it.a).map((w, k) => k)), picked: [], tries: [], ok: false, shown: false };
  });
}
const S = { part: 0, tab: 0, pos: EX.map(() => 0), ex: EX.map(newState), fin: EX.map(() => false), voice: EX.map(() => false), pops: 0 };

const answered = st => st.ok || st.shown;
const itemsDone = e => !EX[e].items || ["write", "final"].includes(EX[e].type) || S.ex[e].every(answered);
const isRight = (it, opt) => Array.isArray(it.a) ? it.a.includes(opt) : opt === it.a;
const ansText = it => Array.isArray(it.a) ? it.a.join(" / ") : it.a;
const MAXT = 2;

function reward() {
  const p = POPS[S.pops % POPS.length]; S.pops++; HW.save();
  $("popImg").src = p.img; $("popTxt").textContent = p.lines[Math.floor(Math.random() * p.lines.length)];
  $("pop").hidden = false;
}
$("popBtn").onclick = () => { $("pop").hidden = true; };
function finish(e) { if (!S.fin[e]) { S.fin[e] = true; render(); reward(); } }

/* text to speech (phone's own English voice) */
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(t) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.85; if (VOICE) u.voice = VOICE; speechSynthesis.speak(u); }
  catch (e) { alert("Звук не работает в этом браузере. Откройте домашку в Chrome или Safari."); }
}

/* ---------- navigation ---------- */
const tabsOf = p => EX.map((x, k) => k).filter(k => EX[k].part === p);
function stopDone(e) { return S.fin[e]; }
function renderParts() {
  const lbl = [["Часть 1", "Тренируем · 6 заданий"], ["Часть 2", "Вспоминаем и говорим · 4"]];
  $("parts").innerHTML = lbl.map((l, p) => '<button type="button" data-p="' + p + '" class="' + (S.part === p ? "on" : "") + '">' + l[0] +
    (tabsOf(p).every(stopDone) ? " ✓" : "") + '<small>' + l[1] + '</small></button>').join("");
  $("parts").querySelectorAll("button").forEach(b => b.onclick = () => { S.part = +b.dataset.p; S.tab = tabsOf(S.part)[0]; render(); });
}
function renderTabs() {
  $("tabs").innerHTML = tabsOf(S.part).map(k => '<button type="button" data-t="' + k + '" class="' + (S.tab === k ? "on " : "") + (S.fin[k] ? "fin" : "") + '">' +
    EX[k].tab + (S.fin[k] ? " ✓" : "") + '</button>').join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = +b.dataset.t; render(); });
}
function goNextStop(e) {
  const nx = e + 1;
  if (nx < EX.length) { S.tab = nx; S.part = EX[nx].part; }
  render(); window.scrollTo(0, 0);
}

/* ---------- shared pieces ---------- */
function progress(pos, n) { return '<div style="display:grid;gap:6px"><span class="count">' + (pos + 1) + ' / ' + n + '</span><div class="bar"><i style="width:' + Math.round(pos / n * 100) + '%"></i></div></div>'; }
function feedback(st, it, okMsg) {
  if (st.ok) return '<p class="fb good" lang="en">' + (okMsg || (st.tries.length === 1 ? "Correct!" : "Yes, that's it!")) + '</p>';
  if (st.shown) return '<p class="fb bad" lang="en">Not quite. The answer is: <b>' + esc(ansText(it)) + '</b></p>';
  if (st.tries.length) return '<p class="fb bad" lang="en">Not quite. Try again.</p>';
  return "";
}
function navHTML(pos, n, fin) {
  return '<div class="nav"><button type="button" class="ghost" id="prev"' + (pos ? "" : " disabled") + '>←</button>' +
    '<button type="button" id="nx"' + (fin ? "" : " disabled") + '>' + (pos === n - 1 ? "Finish" : "Next →") + '</button></div>';
}
function wireNav(e, pos) {
  $("prev").onclick = () => { if (S.pos[e] > 0) { S.pos[e]--; render(); } };
  $("nx").onclick = () => { const n = EX[e].items.length; if (S.pos[e] < n - 1) { S.pos[e]++; render(); } else { S.pos[e] = n; if (!EX[e].voice) finish(e); else render(); } };
}
function firstTime(e) { return S.ex[e].filter(st => st.ok && st.tries.length === 1).length; }
function doneCard(e, extra) {
  const n = EX[e].items.length, last = e === EX.length - 1;
  return '<div class="card done"><b>Finished!</b><p>' + firstTime(e) + ' of ' + n + ' right first time.</p>' + (extra || "") +
    '<div class="nav"><button type="button" class="ghost" id="again">Look again</button>' +
    (last ? "" : '<button type="button" id="go">' + (e === 5 ? "Part 2 →" : "Next task →") + '</button>') + '</div></div>';
}
function wireDone(e) { $("again").onclick = () => { S.pos[e] = 0; render(); }; if ($("go")) $("go").onclick = () => goNextStop(e); }
function sendHTML(e) {
  if (e === 5) return '<div class="card" style="gap:10px"><p class="small">Часть 1 готова? Если на часть 2 нет времени — отправьте сейчас, часть 2 сделаем на уроке. Если сделаете часть 2 потом, ответы всё равно сохранятся.</p><div id="send"></div></div>';
  return '<div id="send"></div>';
}
function mountSend() { const box = $("send"); if (!box) return; const sb = HW.sendBlock(); if (sb.className === "hw-sent") sb.textContent = "Отправлено ✓ Stacy видит ваши ответы."; box.appendChild(sb); }

/* ---------- verb table ---------- */
function tableHTML(e) {
  const ex = EX[e], rows = VERBS.map(v => ({ v, c: [] }));
  ex.items.forEach((it, i) => { if (!it.c) return; const st = S.ex[e][i]; if (!answered(st)) return;
    const v = st.ok ? st.tries[st.tries.length - 1] : it.a[0]; rows[VERBS.indexOf(v)].c.push(it.c); });
  return '<div class="card" style="gap:8px"><p class="eyebrow">Your table</p><table class="vtab" lang="en">' +
    rows.map(r => '<tr><td>' + esc(r.v) + '</td><td class="chips">' + r.c.map(c => '<span>' + esc(c) + '</span>').join("") + '</td></tr>').join("") + '</table></div>';
}

/* ---------- renderers ---------- */
function renderMCQ(e) {
  const app = $("app"), ex = EX[e], n = ex.items.length, pos = Math.min(S.pos[e], n);
  let h = '<p class="how">' + esc(ex.how) + '</p>';
  if (pos >= n) {
    let extra = "";
    if (ex.voice) extra = '<div style="display:grid;gap:8px;text-align:left"><p class="small">Теперь послушайте каждую фразу и повторите 2–3 раза. Потом запишите голосовое сообщение в Telegram с этими тремя фразами.</p>' +
      ex.voice.map((t, k) => '<button type="button" class="play sm" data-say="' + esc(t) + '" lang="en">▶ ' + esc(t) + '</button>').join("") +
      '<button type="button" class="tick' + (S.voice[e] ? " on" : "") + '" id="vt">' + (S.voice[e] ? "✓ Голосовое отправлено" : "Я отправила голосовое") + '</button></div>';
    app.innerHTML = h + (ex.table ? tableHTML(e) : "") + doneCard(e, extra) + (e === 5 ? sendHTML(e) : "");
    wireDone(e); app.querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(b.dataset.say));
    if ($("vt")) $("vt").onclick = () => { if (HW.preview) return; S.voice[e] = !S.voice[e]; if (S.voice[e] && !S.fin[e]) { finish(e); return; } render(); };
    mountSend(); return;
  }
  const it = ex.items[pos], st = S.ex[e][pos], fin = answered(st);
  let sent;
  if (it.c) sent = '<p class="sent" lang="en"><span class="gap">___</span> <b>' + esc(it.c) + '</b></p>';
  else if (it.q) sent = '<p class="sent" lang="en">' + esc(it.q) + '</p>';
  else if (it.qr) sent = '<p class="sent" style="font-size:1.1rem">' + esc(it.qr) + '</p>';
  else if (it.say) sent = '<button type="button" class="play" id="say">▶ Listen</button>';
  else sent = '<p class="sent" lang="en">' + esc(it.pre) + (fin ? '<span class="fill">' + esc(it.a) + '</span>' : '<span class="gap">___</span>') + esc(it.post) + '</p>';
  h += (ex.table && pos > 0 ? tableHTML(e) : "") + '<div class="card">' + progress(pos, n) + sent +
    '<div class="opts' + (it.c ? " vbtns" : "") + '" lang="en">' +
    st.order.map(o => { const tried = st.tries.indexOf(o) >= 0, cls = (isRight(it, o) && fin) ? "right" : (tried && !isRight(it, o)) ? "wrong" : "";
      return '<button type="button" class="opt ' + cls + '" data-o="' + esc(o) + '"' + (fin || tried ? " disabled" : "") + '>' + esc(o) + '</button>'; }).join("") + '</div>' +
    feedback(st, it, it.c && it.a.length > 1 && st.ok ? "Yes! " + it.a.join(" and ") + " both work here." : null) + navHTML(pos, n, fin) + '</div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (answered(st) || HW.preview) return; const o = b.dataset.o; if (st.tries.indexOf(o) >= 0) return;
    st.tries.push(o); if (isRight(it, o)) st.ok = true; else if (st.tries.length >= MAXT) st.shown = true; render(); });
  if ($("say")) { $("say").onclick = () => speak(it.say); }
  wireNav(e, pos);
}

function renderMulti(e) {
  const app = $("app"), ex = EX[e], n = ex.items.length, pos = Math.min(S.pos[e], n);
  let h = '<p class="how">' + esc(ex.how) + '</p>';
  if (pos >= n) { app.innerHTML = h + doneCard(e); wireDone(e); return; }
  const it = ex.items[pos], st = S.ex[e][pos], fin = answered(st);
  h += '<div class="card">' + progress(pos, n) + '<p class="sent" lang="en">' + esc(it.q) + '</p><div class="opts multi" lang="en">' +
    st.order.map(k => { const good = it.ok.includes(k), cls = fin ? (good ? "right" : "wrong") : (st.sel.includes(k) ? "sel" : "");
      return '<button type="button" class="opt ' + cls + '" data-k="' + k + '"' + (fin ? " disabled" : "") + '>' + (fin && !good ? "✗ " : "") + esc(it.opts[k]) + '</button>'; }).join("") + '</div>';
  if (!fin) h += '<button type="button" class="check" id="chk"' + (st.sel.length ? "" : " disabled") + '>Check</button>';
  if (st.ok) h += '<p class="fb good" lang="en">' + (st.tries.length === 1 ? "Correct!" : "Yes, that's it!") + '</p>';
  else if (st.shown) h += '<p class="fb bad" lang="en">The odd one out: <b>' + esc(it.opts.find((o, k) => !it.ok.includes(k))) + '</b></p>';
  else if (st.tries.length) h += '<p class="fb bad" lang="en">Not quite. Try again.</p>';
  h += navHTML(pos, n, fin) + '</div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (fin || HW.preview) return; const k = +b.dataset.k, i = st.sel.indexOf(k); if (i >= 0) st.sel.splice(i, 1); else st.sel.push(k); render(); });
  if ($("chk")) $("chk").onclick = () => {
    if (HW.preview) return; const sel = st.sel.slice().sort();
    st.tries.push(sel.map(k => it.opts[k]).join(", "));
    if (sel.length === it.ok.length && sel.every((k, i) => k === it.ok.slice().sort()[i])) st.ok = true; else if (st.tries.length >= MAXT) st.shown = true;
    render(); };
  wireNav(e, pos);
}

function lettersHint(w) { return w.length <= 2 ? w : w[0] + " " + "_ ".repeat(w.length - 2) + w[w.length - 1]; }
function renderType(e) {
  const app = $("app"), ex = EX[e], n = ex.items.length, pos = Math.min(S.pos[e], n);
  let h = '<p class="how">' + esc(ex.how) + '</p>';
  if (pos >= n) { app.innerHTML = h + doneCard(e); wireDone(e); return; }
  const it = ex.items[pos], st = S.ex[e][pos], fin = answered(st);
  const gap = fin ? '<span class="fill">' + esc(st.ok ? st.tries[st.tries.length - 1] : it.a[0]) + '</span>'
    : ex.letters ? '<span class="hintw">' + esc(lettersHint(it.a[0])) + '</span>' : '<span class="gap">___</span> <span class="small">(' + esc(it.hint) + ')</span>';
  h += '<div class="card">' + progress(pos, n) + '<p class="sent" lang="en">' + esc(it.pre) + gap + esc(it.post) + '</p>';
  if (!fin) h += '<input class="inp" id="inp" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here" value="' + esc(st.val) + '">' +
    '<button type="button" class="check" id="chk">Check</button>';
  h += feedback(st, { a: it.a[0] }) + navHTML(pos, n, fin) + '</div>';
  app.innerHTML = h;
  if ($("inp")) {
    $("inp").oninput = ev => { st.val = ev.target.value; HW.save(); };
    $("inp").onkeydown = ev => { if (ev.key === "Enter") $("chk").click(); };
    $("chk").onclick = () => { if (HW.preview) return; const v = norm(st.val); if (!v) return;
      st.tries.push(st.val.trim()); if (it.a.map(norm).includes(v)) st.ok = true; else if (st.tries.length >= MAXT) st.shown = true; else st.val = ""; render(); };
  }
  wireNav(e, pos);
}

function renderOrder(e) {
  const app = $("app"), ex = EX[e], n = ex.items.length, pos = Math.min(S.pos[e], n);
  let h = '<p class="how">' + esc(ex.how) + '</p>';
  if (pos >= n) {
    const extra = '<div style="display:grid;gap:8px;text-align:left"><p class="small">' + esc(ex.voice) + '</p><div class="stems" lang="en"><b>Model</b><span>Ivan took a guided tour of … on his last trip to …</span><span>I took a … tour of … on my last trip to …</span></div>' +
      '<button type="button" class="tick' + (S.voice[e] ? " on" : "") + '" id="vt">' + (S.voice[e] ? "✓ Голосовое отправлено" : "Я отправила голосовое") + '</button></div>';
    app.innerHTML = h + doneCard(e, extra); wireDone(e);
    $("vt").onclick = () => { if (HW.preview) return; S.voice[e] = !S.voice[e]; if (S.voice[e] && !S.fin[e]) { finish(e); return; } render(); };
    return;
  }
  const it = ex.items[pos], st = S.ex[e][pos], fin = answered(st), w = words(it.a);
  h += '<div class="card">' + progress(pos, n) + '<div class="profile" lang="en"><b>' + esc(it.cue) + '</b></div>' +
    '<div class="line" lang="en">' + (fin ? '<span class="fill">' + esc(it.a) + '</span>' : esc(st.picked.map(k => w[k]).join(" ")) || '<span class="small">Tap the words…</span>') + '</div>';
  if (!fin) h += '<div class="tiles" lang="en">' + st.tiles.map(k => '<button type="button" class="tile" data-k="' + k + '"' + (st.picked.includes(k) ? " disabled" : "") + '>' + esc(w[k]) + '</button>').join("") + '</div>' +
    '<div class="nav"><button type="button" class="ghost" id="undo"' + (st.picked.length ? "" : " disabled") + '>Undo</button><button type="button" id="chk"' + (st.picked.length === w.length ? "" : " disabled") + '>Check</button></div>';
  h += feedback(st, it) + navHTML(pos, n, fin) + '</div>';
  app.innerHTML = h;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => { if (HW.preview) return; st.picked.push(+b.dataset.k); render(); });
  if ($("undo")) $("undo").onclick = () => { st.picked.pop(); render(); };
  if ($("chk")) $("chk").onclick = () => { if (HW.preview) return; const said = st.picked.map(k => w[k]).join(" ");
    st.tries.push(said); if (said === it.a) st.ok = true; else if (st.tries.length >= MAXT) st.shown = true; else st.picked = []; render(); };
  wireNav(e, pos);
}

function renderWrite(e) {
  const app = $("app"), ex = EX[e];
  let h = '<p class="how">' + esc(ex.how) + '</p><div class="stems" lang="en"><b>You can use</b>' + ex.stems.map(s => '<span>' + esc(s) + '</span>').join("") + '</div>';
  ex.items.forEach((it, i) => { h += '<div class="card" style="gap:10px"><div class="profile" lang="en"><b>' + esc(it.who) + '</b><span>' + esc(it.facts) + '</span></div>' +
    '<textarea class="inp" lang="en" data-i="' + i + '" placeholder="Hello, my name is Inna…">' + esc(S.ex[e][i].text) + '</textarea></div>'; });
  const ready = S.ex[e].every(x => x.text.trim().length > 15);
  h += '<button type="button" class="btn primary" id="wdone"' + (ready ? "" : " disabled") + '>' + (S.fin[e] ? "✓ Done — next task →" : "Done →") + '</button>';
  app.innerHTML = h;
  app.querySelectorAll("textarea").forEach(t => t.oninput = () => { S.ex[e][+t.dataset.i].text = t.value; HW.save();
    $("wdone").disabled = !S.ex[e].every(x => x.text.trim().length > 15); });
  $("wdone").onclick = () => { if (!S.fin[e]) { S.fin[e] = true; S.tab = e + 1; render(); window.scrollTo(0, 0); reward(); } else goNextStop(e); };
}

function renderFinal(e) {
  const app = $("app"), ex = EX[e], st = S.ex[e][0];
  app.innerHTML = '<p class="how">' + esc(ex.how) + '</p><div class="card"><ol class="qs" lang="en">' + ex.qs.map(q => '<li>' + esc(q) + '</li>').join("") + '</ol>' +
    (st.hint ? '<div class="stems" lang="en"><b>Word bank</b>' + ex.bank.map(s => '<span>' + esc(s) + '</span>').join("") + '</div>'
      : '<button type="button" class="check" id="hint">Показать подсказку</button>') +
    '<button type="button" class="tick' + (S.voice[e] ? " on" : "") + '" id="vt">' + (S.voice[e] ? "✓ Голосовое отправлено" : "Я отправила голосовое") + '</button></div>' +
    sendHTML(e) + (!HW.submitted ? '<p class="note">Когда закончите, нажмите «Готово».</p>' : "");
  if ($("hint")) $("hint").onclick = () => { if (HW.preview) return; st.hint = true; render(); };
  $("vt").onclick = () => { if (HW.preview) return; S.voice[e] = !S.voice[e]; if (S.voice[e] && !S.fin[e]) { finish(e); return; } S.fin[e] = S.voice[e]; render(); };
  mountSend();
}

function render() {
  if (EX[S.tab].part !== S.part) S.part = EX[S.tab].part;
  renderParts(); renderTabs();
  const t = EX[S.tab].type;
  ({ mcq: renderMCQ, multi: renderMulti, type: renderType, order: renderOrder, write: renderWrite, final: renderFinal })[t](S.tab);
  HW.save();
}

/* ---------- summary for Stacy ---------- */
function tries(st) { return st.tries.join(" → ") + " (" + st.tries.length + (st.tries.length === 1 ? " try" : " tries") + ")" + (st.shown ? ", answer shown" : ""); }
function exSummary(e) {
  const ex = EX[e], sts = S.ex[e], head = "Task " + (e + 1) + " · " + ex.name + (ex.part ? " (part 2)" : " (part 1)");
  if (ex.type === "write") return [head].concat(ex.items.map((it, i) => (sts[i].text.trim() ? "✓ " : "✗ ") + it.who + ": " + (sts[i].text.trim() || "—")));
  if (ex.type === "final") return [head, (S.voice[e] ? "✓ She ticked: voice message sent in Telegram" : "✗ Not ticked as sent yet") + " — check your Telegram", "Word bank opened: " + (sts[0].hint ? "yes" : "no")];
  const lines = [head, firstTime(e) + " of " + ex.items.length + " right first time"];
  ex.items.forEach((it, i) => { const st = sts[i];
    const label = it.c ? "___ " + it.c : it.q ? it.q : it.qr ? it.qr : it.say ? "🔊 " + it.say : it.cue ? it.cue : (it.pre + "[" + ansText(it) + "]" + (it.post || "")).trim();
    lines.push((i + 1) + ". " + label + " → " + (!st.tries.length ? "— not answered" : (st.ok ? "✓ " : "✗ ") + tries(st))); });
  if (ex.voice) lines.push((S.voice[e] ? "✓ She ticked: voice message sent" : "✗ Voice message not ticked yet") + " — check your Telegram");
  return lines;
}

HW.start({
  id: "hw7", title: "Trips, tours and activities",
  get: () => S,
  set: z => {
    if (!z) return;
    if (Array.isArray(z.ex) && z.ex.length === EX.length) z.ex.forEach((arr, e) => { if (Array.isArray(arr) && arr.length === S.ex[e].length) S.ex[e] = arr; });
    if (Array.isArray(z.pos) && z.pos.length === EX.length) S.pos = z.pos.map((p, e) => Math.max(0, Math.min(+p || 0, (EX[e].items || []).length)));
    if (Array.isArray(z.fin) && z.fin.length === EX.length) S.fin = z.fin.map(Boolean);
    if (Array.isArray(z.voice) && z.voice.length === EX.length) S.voice = z.voice.map(Boolean);
    S.tab = (+z.tab >= 0 && +z.tab < EX.length) ? +z.tab : 0; S.part = EX[S.tab].part; S.pops = +z.pops || 0;
  },
  summary: () => EX.map((x, e) => exSummary(e).join("\n")).join("\n\n"),
  render
});
</script>
</body>
</html>
