<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Health questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap">
<style>
:root{
  --bg:#f1f4f1; --surface:#ffffff; --ink:#1b2624; --muted:#5b6b67; --line:#d5dfdb;
  --river:#1f5f5b; --river-soft:#dcebe7; --vest:#e2702a; --vest-soft:#fbe6d8;
  --good:#2f7d4a; --good-soft:#dff0e4; --bad:#b2402f; --bad-soft:#f7e0db;
  --display:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111816; --surface:#1a2320; --ink:#e7eeeb; --muted:#9fb0ab; --line:#2c3a36;
  --river:#7cc4bb; --river-soft:#1d3532; --vest:#f2944f; --vest-soft:#3a2a1e;
  --good:#79c893; --good-soft:#1c3324; --bad:#ec8c7c; --bad-soft:#3b2220; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6;letter-spacing:.01em;word-spacing:.06em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:110px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.15rem;font-weight:700;color:var(--river)}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.15rem}
p{margin:0}
.rubric{color:var(--muted);font-size:1rem;max-width:62ch}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;font-family:var(--display);font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.tab[aria-current="true"]{background:var(--river);color:var(--bg);border-color:var(--river)}
.tab.done::after{content:" ✓";color:var(--good)}
.tab[aria-current="true"].done::after{color:var(--bg)}
.stage{display:flex;flex-direction:column;gap:18px;padding-top:22px}
.stage-head{display:flex;flex-direction:column;gap:6px}
.step{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--vest)}
.note{background:var(--river-soft);border-radius:12px;padding:12px 14px;font-size:1rem}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--vest);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:1rem;min-height:44px}
.btn.primary{background:var(--river);color:var(--bg);border-color:var(--river)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}

/* task 1 */
.sbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.1rem;min-height:56px}
.sbtn .num{font-family:var(--display);color:var(--muted);font-size:.9rem;min-width:2ch;padding-top:3px}
.sitem{display:flex;flex-direction:column;gap:8px}
.sitem.good .sbtn{border-color:var(--good);background:var(--good-soft)}
.sitem.fix .sbtn{border-color:var(--vest);background:var(--vest-soft)}
.sitem.fixed .sbtn{border-color:var(--good);background:var(--good-soft)}
.sitem.missed .sbtn{border:2px dashed var(--vest)}
mark{background:var(--bad-soft);color:var(--bad);font-weight:700;border-radius:4px;padding:0 3px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
mark.ok{background:var(--good-soft);color:var(--good);text-decoration:none}
.fixrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:4px}
.fixrow input,.gap input{font:inherit;font-size:1.05rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);min-height:44px;flex:1;min-width:160px}
.fb{font-size:1rem;border-radius:10px;padding:8px 12px}
.fb.ok{background:var(--good-soft);color:var(--good);font-weight:700}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--river-soft);color:var(--ink)}

/* task 2 */
.people{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;font-family:var(--display);font-size:.9rem}
.pbtn[aria-current="true"]{background:var(--vest);border-color:var(--vest);color:#fff}
.pbtn.done::after{content:" ✓"}
.profile{display:flex;gap:14px;align-items:flex-start}
.avatar{width:72px;height:72px;object-fit:cover;border-radius:50%;background:var(--river);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;flex:none}
.meta{color:var(--muted);font-size:.95rem}
.story{font-size:1.05rem}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.95rem}
.banner{position:relative;height:210px;border-radius:18px;overflow:hidden;background:var(--river)}
.bimgs{position:absolute;inset:0;display:flex;gap:3px}
.bimgs img{flex:1;min-width:0;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,18,.78) 0%,rgba(10,20,18,.25) 45%,rgba(10,20,18,0) 70%)}
.bcap{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;display:flex;flex-direction:column;gap:2px;color:#fff}
.bcap h2{color:#fff;font-size:1.6rem;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.photo{position:relative;border-radius:18px;overflow:hidden;background:var(--river-soft)}
.photo .bimgs{gap:6px;background:var(--bg)}
.photo .bimgs img{border-radius:0}
.photo .bimgs img:first-child{flex:1.5}
.pcap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;margin:0;color:#fff;font-family:var(--display);font-size:1.35rem;font-weight:700;background:linear-gradient(to top,rgba(10,20,18,.75),rgba(10,20,18,0))}
.bstep{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:#ffd2b3}
@media (min-width:600px){.banner{height:260px}}

.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.pic{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.pic figcaption{font-size:.85rem;line-height:1.3;padding:6px 8px}
.tip{background:var(--vest-soft);border-radius:12px;padding:10px 14px;font-size:1rem}
details summary{cursor:pointer;font-family:var(--display);font-size:.95rem;color:var(--river);min-height:36px;display:flex;align-items:center}
.guess{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stem{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.95rem;min-height:40px}
.stem[aria-pressed="true"]{background:var(--river-soft);border-color:var(--river);font-weight:700}
.gap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:1.05rem}
.truth{background:var(--river-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.truth ul{margin:0;padding-left:20px}
.res{font-size:.95rem;font-weight:700}
.res.ok{color:var(--good)}.res.no{color:var(--bad)}.res.q{color:var(--muted)}

/* voice / interview */
.stembox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:1.1rem}
.stembox span{color:var(--muted)}
.big{background:var(--vest-soft);border-radius:14px;padding:18px;font-size:1.05rem;display:flex;flex-direction:column;gap:8px}
textarea.qs{width:100%;min-height:150px;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.backlink{font-family:var(--display);font-size:.85rem;color:var(--muted);text-decoration:none;min-height:32px;display:flex;align-items:center}
.copied{color:var(--good);font-weight:700;font-size:.95rem}
.copybox{width:100%;min-height:120px;font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;z-index:5}
.foot .btn{flex:1;max-width:220px}
@media (prefers-reduced-motion:no-preference){.stage{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
@media (max-width:420px){body{font-size:18px}.sbtn{font-size:1.02rem}.avatar{width:46px;height:46px;font-size:1.2rem}}

/* hw7 extras */
.ph{display:grid;place-items:center;background:var(--river-soft);color:var(--river);font-size:2.2rem;width:100%;height:100%}
.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:36px;min-width:36px;padding:2px 10px;font-size:1rem}
.wchips{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:calc(118px + env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding:8px 0}
.wchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;font-size:1.05rem}
.wchip[aria-pressed="true"]{background:var(--vest);border-color:var(--vest);color:#fff;font-weight:700}
.wchip.used{opacity:.35;text-decoration:line-through}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{display:flex;flex-direction:column;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;padding:0;text-align:left;min-width:0}
.mcard .pimg{aspect-ratio:4/3;width:100%;overflow:hidden;background:var(--river-soft)}
.mcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .lab{padding:8px 10px;font-size:.95rem;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mcard.ok{border-color:var(--good)}
.mcard.ok .lab{background:var(--good-soft)}
.mcard.shown{border-color:var(--vest)}
.mcard.shown .lab{background:var(--vest-soft)}
.mcard.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.def{font-size:.9rem;color:var(--muted);width:100%}
.info{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--vest);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.info .pron{font-family:var(--display);color:var(--river)}
.citem{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.citem.good{border-color:var(--good);background:var(--good-soft)}
.citem.shown{border-color:var(--vest);background:var(--vest-soft)}
.citem .q{font-size:1.1rem}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--river);text-align:center;font-weight:700;color:var(--river)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;min-height:44px;font-size:1rem}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colhead{border-radius:12px;padding:10px 12px;font-family:var(--display);font-size:.95rem;display:flex;flex-direction:column;gap:2px}
.colhead.u{background:var(--river-soft)}.colhead.e{background:var(--vest-soft)}
.colhead small{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.srow b{font-size:1.05rem}
.srow.u{border-left:5px solid var(--river)}.srow.e{border-left:5px solid var(--vest)}
.qline{font-size:1.1rem}
/* messenger */
.chat{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.chead{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--river);color:#fff}
.chead .av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--river-soft)}
.chead .av img{width:100%;height:100%;object-fit:cover;display:block}
.chead .nm{font-family:var(--display);font-weight:700;line-height:1.2}
.chead .st{font-size:.85rem;opacity:.85}
.cbody{display:flex;flex-direction:column;gap:8px;padding:14px 10px;background:var(--bg);min-height:280px}
.msg{max-width:84%;padding:8px 12px;border-radius:16px;font-size:1.02rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.her{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:#d9f2d0;color:#1b2624;border-bottom-right-radius:4px}
@media (prefers-color-scheme: dark){.msg.me{background:#2c4a33;color:#e7eeeb}}
.msg time{display:block;text-align:right;font-size:.72rem;opacity:.6;margin-top:2px}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:.95rem;padding:4px 10px}
.task{align-self:center;background:var(--vest-soft);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:.9rem;text-align:center;margin:4px 0}
.cbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface);align-items:flex-end}
.cbar textarea{flex:1;font:inherit;font-size:1.02rem;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;min-height:44px;max-height:120px;resize:none;background:var(--bg);color:var(--ink)}
.cbar .send{width:48px;height:48px;border-radius:50%;border:none;background:var(--river);color:#fff;font-size:1.3rem;flex:none}
.cbar .send[disabled]{opacity:.4}
.fbitem{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.fbitem.good{border-color:var(--good)}
.fbitem .his{font-size:1.05rem;background:var(--bg);border-radius:10px;padding:6px 10px}
.fbitem .topic{font-size:.85rem;color:var(--muted);font-family:var(--display)}
.mem{display:flex;flex-direction:column;gap:4px}
.mem label{font-family:var(--display);font-size:.95rem}
.mem input{font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);min-height:44px;width:100%}
table.real{width:100%;border-collapse:collapse;font-size:1rem}
table.real td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.real td:first-child{font-family:var(--display);white-space:nowrap;color:var(--river);width:1%}
.hw-sent{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:10px;padding:10px 14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="../" class="backlink" data-hw-back>← My English</a>
    <h1>Health questions · Do you…? / Have you ever…?</h1>
    <nav class="tabs" id="tabs" aria-label="Задания"></nav>
  </header>
  <main id="app"></main>
</div>
<div class="foot">
  <button class="btn" id="prev">← Назад</button>
  <button class="btn primary" id="next">Дальше →</button>
</div>
<script src="../../../kit/hw.js"></script>
<script>
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function norm(s){return (s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"«»()]/g," ").replace(/\s+/g," ").trim();}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function sayBtn(t){return el("button",{class:"say","aria-label":"Listen: "+t,onclick:e=>{e.stopPropagation();say(t);}},"🔊");}
/* real photo, or a neutral icon while the photo is missing */
function pic(src,icon,cls){const box=el("div",{class:cls||"pimg"});const im=el("img",{src:src,alt:""});im.onerror=()=>{im.replaceWith(el("div",{class:"ph","aria-hidden":"true"},icon||"🍽"));};box.append(im);return box;}
function banner(srcs,step,title){
  return el("div",{class:"banner"},
    el("div",{class:"bimgs","aria-hidden":"true"},...srcs.map(s=>{const im=el("img",{src:s,alt:""});im.onerror=()=>im.remove();return im;})),
    el("div",{class:"bcap"},step?el("span",{class:"bstep"},step):null,el("h2",{},title)));
}
function triesTxt(arr){return arr&&arr.length?arr.join(" → ")+` (${arr.length} ${arr.length===1?"try":"tries"})`:"";}

/* ================= DATA ================= */
/* Task 1: photos */
const WORDS=[
  {id:"fasting",w:"fasting",img:"img/fasting.webp",icon:"⏳",def:"not eating for many hours"},
  {id:"detox",w:"a detox",img:"img/detox.webp",icon:"🥤",def:"a few days of only juice, water or vegetables"},
  {id:"poison",w:"food poisoning",img:"img/food-poisoning.webp",icon:"🤢",def:"you feel very sick after bad food"},
  {id:"diet",w:"a diet",img:"img/diet.webp",icon:"🥗",def:"you eat less or stop eating some food, often to lose weight"},
  {id:"bone",w:"a broken bone",img:"img/broken-bone.webp",icon:"🦴",def:"for example, a broken leg or arm"}
];
/* Task 2: which verb? */
const T2=[
  {pre:"",post:"on a diet",a:"be",o:["be","do","make","have"]},
  {pre:"",post:"fasting",a:"try",o:["try","make","be","take"]},
  {pre:"",post:"once a week",a:"fast",o:["fast","fasting","eat","do"],note:"fast = verb: I fast, she fasts"},
  {pre:"",post:"a detox",a:"do",o:["do","make","take","be"]},
  {pre:"",post:"food poisoning",a:"have",o:["have","make","do","take"]},
  {pre:"",post:"a bone",a:"break",o:["break","hurt","cut","make"]},
  {pre:"",post:"to lose weight",a:"try",o:["try","do","make","go"]},
  {pre:"",post:"a marathon",a:"run",o:["run","do","go","make"]}
];
/* Task 3: complete the sentence */
const T3=[
  {s:"My friend Masha ___ every Monday. She doesn't eat anything until Tuesday morning.",a:"fasts",o:["fasts","fasting","tries fasting"]},
  {s:"Some people eat only from 12 to 8 pm. This is called ___.",a:"intermittent fasting",o:["intermittent fasting","dry fasting","a detox"]},
  {s:"I ___ once, but it was too hard. I was hungry and angry all day!",a:"tried fasting",o:["tried fasting","fasted","was fasting"]},
  {s:"___ is very difficult: no food and no water.",a:"Dry fasting",o:["Dry fasting","Intermittent fasting","A diet"]},
  {s:"After the holidays, my sister usually ___: only green juices and water for three days.",a:"does a detox",o:["does a detox","makes a detox","has a detox"]},

/* Checks his chat question. Returns {ok, hint}. Hints are in Russian, like Stacy's delayed feedback. */
function checkQ(id,raw){
  const t=norm(raw);
  if(!t)return {ok:false,hint:"Напиши вопрос."};
  const ROUTINE=/^(do you|how often do you|what do you|how well do you|how many hours do you|when do you|what time do you)\b/;
  const item=CHAT.find(c=>c.id===id);
  if(item.type==="u"){
    if(/^how often you\b/.test(t))return {ok:false,hint:"После How often не хватает одного слова. How often ___ you…?"};
    if(/^(you|are you|is you)\b/.test(t))return {ok:false,hint:"Как начинается вопрос про обычную жизнь? Do you…? или How often do you…?"};
    if(/^have you\b/.test(t))return {ok:false,hint:"Это вопрос про обычную жизнь (usually), а не про опыт. Начни с Do you…? или How often do you…?"};
    if(/^does you\b/.test(t))return {ok:false,hint:"you → do, не does."};
    if(!ROUTINE.test(t))return {ok:false,hint:"Начни вопрос с Do you…? или How often do you…?"};
    if(id==="sleep"){ if(/\bsleep (good|nice)\b/.test(t))return {ok:false,hint:"sleep + ? (не good). Как мы говорим «хорошо спать»?"};
      if(/\bsleeps?\b/.test(t))return {ok:true}; return {ok:false,hint:"Вопрос должен быть про сон: sleep well."}; }
    if(id==="sport"){ if(/\bworkout\b/.test(t)&&!/\b(a|your) workout\b/.test(t))return {ok:false,hint:"Глагол пишется в два слова: work ___ ."};
      if(/\bdo you (do|play) sport\b|\b(work out|exercise|exercises|do sports?|play sports?|go to (the )?gym|do yoga|do cardio|lift weights|go for a run|run|train|do any sports?)\b/.test(t))return {ok:true};
      return {ok:false,hint:"Вопрос должен быть про спорт: work out / exercise / go to the gym."}; }
    if(id==="breakfast"){ if(/\b(skip|have|eat|miss|cook|make) (your |a )?breakfast\b|\bfor breakfast\b/.test(t))return {ok:true};
      if(/\bbreakfast\b/.test(t))return {ok:false,hint:"Какой глагол с breakfast? have breakfast / skip breakfast."};
      return {ok:false,hint:"Вопрос должен быть про завтрак: have breakfast / skip breakfast."}; }
    if(id==="vitamins"){ if(/\b(drink|eat|use) (any |some )?vitamins?\b/.test(t))return {ok:false,hint:"С vitamins мы используем другой глагол. ___ vitamins."};
      if(/\b(take|taking) (any |some )?(vitamins?|supplements)\b|\bvitamins do you take\b/.test(t))return {ok:true};
      return {ok:false,hint:"Вопрос должен быть про витамины: take vitamins."}; }
  }else{
    if(/^(do|did|are|were) you\b/.test(t))return {ok:false,hint:"Это вопрос про опыт в жизни (ever). Начни с Have you ever…?"};
    if(/^(you ever|ever|you have ever)\b/.test(t))return {ok:false,hint:"В начале не хватает слова: ___ you ever…?"};
    if(/^has you\b/.test(t))return {ok:false,hint:"you → have, не has."};
    if(!/^have you\b/.test(t))return {ok:false,hint:"Начни вопрос с Have you ever…?"};
    if(id==="diet"){
      if(/^have you (ever )?been on (a |any )?diets?\b|^have you (ever )?tried (a |any )?diets?\b|^have you (ever )?(tried )?dieted\b/.test(t))return {ok:true};
      if(/^have you (ever )?(be|was|were|being)\b/.test(t))return {ok:false,hint:"be – was – ___. После have нужна третья форма."};
      if(/^have you (ever )?been (in|at) (a )?diet/.test(t))return {ok:false,hint:"Проверь маленькое слово перед a diet: be ___ a diet."};
      if(/^have you (ever )?on (a )?diet/.test(t))return {ok:false,hint:"Не хватает глагола: Have you ever ___ on a diet?"};
      return {ok:false,hint:"Вопрос про диеты: Have you ever + V3 … a diet?"};
    }
    if(id==="fasting"){
      if(/^have you (ever )?(tried|done) (intermittent |dry )?fasting\b|^have you (ever )?fasted\b/.test(t))return {ok:true};
      if(/^have you (ever )?(try|trying|tryed|do|did|fast|fasting)\b/.test(t))return {ok:false,hint:"После have нужна третья форма: try – tried – ___."};
      return {ok:false,hint:"Вопрос про fasting: Have you ever + V3 … fasting?"};
    }
  }
  return {ok:false,hint:"Проверь вопрос ещё раз."};
}

/* generic "choose the option" item: two tries, then the answer is shown */
function choiceItem(st,options,correct,qNode,key,after){
  const box=el("div",{class:"citem"+(st.ok?" good":st.shown?" shown":"")});
  box.append(qNode);
  if(!st.ok&&!st.shown){
    const row=el("div",{class:"opts"});

      const wrong=st.tries.includes(o);
      row.append(el("button",{class:"opt"+(wrong?" wrong":""),disabled:wrong?"":null,onclick:()=>{
        st.tries.push(o);
        if(o===correct)st.ok=true; else if(st.tries.length>=2)st.shown=true;

    });
    box.append(row);
    if(st.tries.length===1)box.append(el("p",{class:"fb no"},"Not quite. Try again."));
  }
  if(st.ok)box.append(el("p",{class:"fb ok"},"✓ "+(st.tries.length===1?"Great!":"Yes!")));
  if(st.shown)box.append(el("p",{class:"fb info"},"Правильно: "+correct+"."));
  if((st.ok||st.shown)&&after)box.append(after);
  return box;
}

  const body=el("div",{class:"cbody"});
  body.append(el("div",{class:"msg her"},HELLO,el("time",{},nowTime(0))));
  S.t5.qs.forEach((q,i)=>{
    body.append(el("div",{class:"task"},CHAT[i].task));
    body.append(el("div",{class:"msg me"},q,el("time",{},nowTime(i+1)+" ✓✓")));
    if(!(TYPING&&i===n-1))body.append(el("div",{class:"msg her"},CHAT[i].reply,el("time",{},nowTime(i+1))));
  });
  if(TYPING)body.append(el("div",{class:"typing"},"Olivia is typing…"));
  else if(n<CHAT.length)body.append(el("div",{class:"task"},CHAT[n].task));
  else body.append(el("div",{class:"msg her"},BYE,el("time",{},nowTime(n+1))));
  chat.append(body);
  if(n<CHAT.length){
    const ta=el("textarea",{rows:"1",placeholder:"Message",autocomplete:"off",autocorrect:"off",autocapitalize:"sentences",spellcheck:"false","aria-label":"Your question"});
    ta.value=DRAFT;
    const send=el("button",{class:"send","aria-label":"Send",disabled:(TYPING||!DRAFT.trim())?"":null},"➤");
    ta.addEventListener("input",()=>{DRAFT=ta.value;send.disabled=TYPING||!DRAFT.trim();});
    const doSend=()=>{if(TYPING||!DRAFT.trim())return;S.t5.qs.push(DRAFT.trim());DRAFT="";TYPING=true;rr();
      setTimeout(()=>{TYPING=false;rr();const c=document.querySelector(".cbody");if(c&&c.lastChild&&c.lastChild.scrollIntoView)c.lastChild.scrollIntoView({block:"nearest"});
        const t=document.querySelector(".cbar textarea");if(t)t.focus();},1600);};
    send.onclick=doSend;
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}});
    chat.append(el("div",{class:"cbar"},ta,send));
  }
  box.append(chat);
  if(n===CHAT.length&&!TYPING)box.append(feedback());
  return box;
}
function feedback(){
  const box=el("div",{class:"list"});
  box.append(el("div",{class:"stage-head",style:"padding-top:10px"},el("h3",{},"Check your questions"),
    el("p",{class:"rubric"},"Вот твои вопросы. Где всё правильно — галочка. Где есть ошибка — подсказка. Исправь вопрос и нажми Check.")));
  CHAT.forEach((c,i)=>{
    const q=S.t5.qs[i],f=S.t5.fb[i];
    if(f.first===undefined){const r=checkQ(c.id,q);f.first=r.ok;if(r.ok)f.ok=true;}
    const card=el("div",{class:"fbitem"+(f.ok?" good":"")});
    card.append(el("span",{class:"topic"},c.task),el("p",{class:"his"},q));
    if(f.ok&&f.first){card.append(el("p",{class:"fb ok"},"✓ Good question!"));box.append(card);return;}
    if(f.ok){card.append(el("p",{class:"fb ok"},"✓ Great! "+f.tries[f.tries.length-1]));box.append(card);return;}
    if(f.shown){card.append(el("p",{class:"fb info"},"You can ask: "+c.model));box.append(card);return;}
    const last=f.tries.length?f.tries[f.tries.length-1]:q;
    card.append(el("p",{class:"fb no"},"💡 "+checkQ(c.id,last).hint));
    const inp=el("input",{type:"text",autocomplete:"off",autocorrect:"off",spellcheck:"false","aria-label":"Corrected question"});
    if(f.val===undefined)f.val=q; inp.value=f.val;
    inp.addEventListener("input",()=>{f.val=inp.value;HW.save();});
    const chk=()=>{if(!norm(f.val))return;f.tries.push(f.val.trim());const r=checkQ(c.id,f.val);
      if(r.ok)f.ok=true; else if(f.tries.length>=2)f.shown=true; rr();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")chk();});
    card.append(el("div",{class:"fixrow"},inp,el("button",{class:"btn primary",onclick:chk},"Check")));
    box.append(card);
  });
  return box;
}

/* ================= TASK 6 · remember ================= */
function r6(){
  const box=el("section",{class:"stage"});
  box.append(head("Задание 6 из 7","What do you remember about Olivia?","Не смотри в чат! Напиши по-английски, что ты помнишь: можно коротко, просто слова (например: 5 hours, bed at 1 am). Потом нажми кнопку и сравни с её ответами."));
  if(S.t5.qs.length<CHAT.length){box.append(el("p",{class:"fb info"},"Сначала закончи чат с Olivia (задание 5)."));return box;}
  const card=el("div",{class:"card"});
  CHAT.forEach((c,i)=>{
    const inp=el("input",{type:"text",autocomplete:"off","aria-label":MEMLAB[c.id],placeholder:"…"});
    inp.value=S.t6.notes[i]; inp.addEventListener("input",()=>{S.t6.notes[i]=inp.value;HW.save();});
    if(S.t6.revealed)inp.setAttribute("readonly","");
    card.append(el("div",{class:"mem"},el("label",{},MEMLAB[c.id]),inp));
  });
  box.append(card);
  if(!S.t6.revealed)box.append(el("div",{class:"row"},el("button",{class:"btn primary",onclick:()=>{S.t6.revealed=true;rr();}},"Посмотреть её ответы")));
  else{
    const tb=el("table",{class:"real"});
    CHAT.forEach(c=>tb.append(el("tr",{},el("td",{},MEMLAB[c.id]),el("td",{},REAL[c.id]))));
    box.append(el("div",{class:"card"},el("b",{},"Olivia's answers. What did you remember?"),tb));
  }
  return box;
}

/* ================= TASK 7 · voice ================= */
function r7(){
  const box=el("section",{class:"stage"});
  box.append(head("Задание 7 из 7","Tell your supervisor",
    "Ты практикант, а я твой supervisor. Запиши мне голосовое в Telegram про твоего клиента Olivia: что она рассказала про сон, спорт, еду, витамины, диеты и fasting. И что, по-твоему, ей нужно. Говори своими словами, не читай с экрана. Можно смотреть в таблицу в задании 6."));
  box.append(el("div",{class:"stembox"},
    el("p",{},"Olivia usually … / She doesn't …"),
    el("p",{},"She has tried … / She has never …"),
    el("p",{},"I think she needs to …")));
  box.append(el("p",{class:"tip"},"Помни: she → sleeps, does, takes, has."));
  box.append(el("div",{class:"big"},el("p",{},"✓ Задания 1–6 → сохраняются здесь"),el("p",{},"🎙 Голосовое → в Telegram")));
  box.append(HW.sendBlock());
  return box;
}

/* ================= SUMMARY (what Stacy reads) ================= */
function summary(){
  const L=[];
  const okN=a=>a.filter(r=>r.ok&&r.tries.length===1).length;
  L.push("Task 1 · New words (photo match)");
  L.push(`${S.t1.res.filter(r=>r.ok&&r.tries.length===1).length} of ${WORDS.length} right first time`);
  WORDS.forEach((w,i)=>{const r=S.t1.res[i];L.push(`${w.w}: ${r.ok?(r.tries.length===1?"✓ first try":"✓ on try "+r.tries.length):r.shown?"✗ shown after 2 tries":"—"}`);});
  L.push("","Task 2 · Which verb?",`${okN(S.t2)} of ${T2.length} right first time`);
  T2.forEach((it,i)=>{const r=S.t2[i];L.push(`___ ${it.post}: ${r.ok&&r.tries.length===1?"✓ "+it.a:r.ok?"✓ "+triesTxt(r.tries):r.shown?"✗ "+triesTxt(r.tries)+" — answer shown":"—"}`);});
  L.push("","Task 3 · Complete the sentence",`${okN(S.t3)} of ${T3.length} right first time`);
  T3.forEach((it,i)=>{const r=S.t3[i];L.push(`${it.s.replace("___","["+it.a+"]")} → ${r.ok&&r.tries.length===1?"✓":r.ok?"✓ "+triesTxt(r.tries):r.shown?"✗ "+triesTxt(r.tries)+" — answer shown":"—"}`);});
  L.push("","Task 4 · Usually or ever? + make the question");
  const srt=S.t4.sort.filter(r=>r.ok).length, bld=S.t4.build.filter(b=>b.ok&&b.stemTries.length<=1&&b.vTries.length<=1).length;
  L.push(`Sorted ${srt} of ${T4.length} right · ${bld} of ${T4.length} questions right first time`);
  T4.forEach((it,i)=>{const s=S.t4.sort[i],b=S.t4.build[i];
    const sp=s.ok?"✓ sorted":s.shown?"✗ sorted wrong":"— not sorted";
    let bp="—";
    if(b.ok||b.shown){const extra=[b.stemTries.length>1?"stems tried: "+b.stemTries.join(" → "):"",b.vTries.length?"V3: "+b.vTries.join(" → "):""].filter(Boolean).join(" · ");
      bp=(b.ok?"✓ ":"✗ answer shown · ")+qText(it,b)+(extra?" ("+extra+")":"");}
    L.push(`${it.p}: ${sp} · ${bp}`);});
  L.push("","Task 5 · Chat with Olivia (typed questions, delayed feedback)");
  const firstOk=S.t5.fb.filter(f=>f.first===true).length;
  L.push(S.t5.qs.length<CHAT.length?`Chat not finished: ${S.t5.qs.length} of ${CHAT.length} questions`:`${firstOk} of ${CHAT.length} questions right first time`);
  CHAT.forEach((c,i)=>{const q=S.t5.qs[i];if(q==null)return;const f=S.t5.fb[i];
    let line=`${c.task.replace(/^\S+\s/,"")}: "${q}"`;
    if(f.first===true)line+=" ✓";
    else if(f.ok)line+=` → fixed ✓ "${f.tries[f.tries.length-1]}"${f.tries.length>1?" (try "+f.tries.length+")":""}${f.tries.length>1?" · earlier: "+f.tries.slice(0,-1).join(" → "):""}`;
    else if(f.shown)line+=` ✗ → tries: ${f.tries.join(" → ")} · model shown`;
    else if(f.first===false)line+=f.tries.length?` ✗ → tries: ${f.tries.join(" → ")}`:" ✗ not corrected yet";
    L.push(line);});
  L.push("","Task 6 · What he remembers about Olivia (before seeing the answers)");
  CHAT.forEach((c,i)=>L.push(`${MEMLAB[c.id].replace(/\s\S+$/,"")}: ${S.t6.notes[i].trim()||"—"}`));
  L.push(S.t6.revealed?"Opened Olivia's answers ✓":"Hasn't opened Olivia's answers yet");
  L.push("","Task 7 · Voice message to supervisor → Telegram");
  return L.join("\n");
}

HW.start({
  id:"hw7", title:"Health questions: Do you…? / Have you ever…?",
  get:()=>S,
  set:(z)=>{
    if(!z)return;
    if(z.t1&&z.t1.res&&z.t1.res.length===WORDS.length&&z.t1.order&&z.t1.order.length===WORDS.length)S.t1=z.t1;
    if(Array.isArray(z.t2)&&z.t2.length===T2.length)S.t2=z.t2;
    if(Array.isArray(z.t3)&&z.t3.length===T3.length)S.t3=z.t3;
    if(z.t4&&z.t4.sort&&z.t4.sort.length===T4.length&&z.t4.build&&z.t4.build.length===T4.length&&z.t4.order&&z.t4.order.length===T4.length)S.t4=z.t4;
    if(z.t5&&Array.isArray(z.t5.qs)&&z.t5.qs.length<=CHAT.length&&z.t5.fb&&z.t5.fb.length===CHAT.length)S.t5=z.t5;
    if(z.t6&&z.t6.notes&&z.t6.notes.length===CHAT.length)S.t6={notes:z.t6.notes.map(String),revealed:!!z.t6.revealed};
    S.stage=Math.min(STAGES.length-1,Math.max(0,z.stage|0));
  },
  summary, render
});
