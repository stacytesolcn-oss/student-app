<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Last week and the weekend · Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Raleway:wght@600;700&display=swap">
<style>
:root{
  --bg:#F6F1E7; --card:#FCFAF5; --ink:#231815; --muted:#6E5C52; --line:#E3D9C8;
  --brown:#643A24; --on-brown:#F6F1E7; --butter:#F4DC96; --butter-soft:#FAF0CF;
  --blue-soft:#E3EEF4; --blue-ink:#2F4C5E;
  --good:#2E6B45; --good-soft:#E2F0E5; --bad:#9A3324; --bad-soft:#F6DFDA;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --caps:"Raleway","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#231815; --card:#2E211C; --ink:#F3ECDF; --muted:#BCA995; --line:#46352C;
  --brown:#F4DC96; --on-brown:#231815; --butter:#F4DC96; --butter-soft:#3F3422;
  --blue-soft:#253743; --blue-ink:#C1DBE8;
  --good:#9FD3AE; --good-soft:#1F3426; --bad:#F0A898; --bad-soft:#43231F;
  color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.back{color:var(--muted);font-size:.9rem;text-decoration:none}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.7rem}
p{margin:0}
.eyebrow{font-family:var(--caps);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;min-height:48px;font-weight:700;padding:6px}
.tabs button.on{border-color:var(--brown);background:var(--brown);color:var(--on-brown)}
.tabs button.fin:not(.on){border-color:var(--good);color:var(--good)}
.how{background:var(--butter-soft);border-radius:18px;padding:12px 16px;font-size:.98rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;display:grid;gap:16px}
.count{font-family:var(--caps);font-size:.78rem;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);border-radius:3px;transition:width .3s}
.sent{font-size:1.25rem;line-height:1.5}
.wrongv{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:0 5px;text-decoration:line-through;text-decoration-thickness:1.5px}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--muted);text-align:center}
.fill{background:var(--good-soft);color:var(--good);border-radius:6px;padding:0 5px;font-weight:700}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.opt{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.1rem;font-weight:600;padding:10px 14px;text-align:center;touch-action:manipulation}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.wrong[disabled]{opacity:.7}
.fb{border-radius:14px;padding:10px 14px;font-weight:600}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px}
.nav button{flex:1;min-height:52px;border-radius:999px;font-weight:700;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown)}
.nav button.ghost{flex:0 0 auto;padding:0 18px;background:transparent;color:var(--ink);border-color:var(--line)}
.nav button[disabled]{opacity:.4;cursor:default}
.done{display:grid;gap:10px;text-align:center;padding:6px 0}
.done b{font-family:var(--display);font-size:1.6rem}
.qs{display:grid;gap:10px;margin:0;padding-left:1.3em;font-size:1.15rem}
.stems{background:var(--blue-soft);color:var(--blue-ink);border-radius:16px;padding:12px 16px;display:grid;gap:4px;font-size:1.05rem}
.stems b{font-family:var(--caps);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.tick{min-height:56px;border-radius:16px;border:1.5px solid var(--brown);background:transparent;color:var(--ink);font-weight:700;font-size:1.02rem;padding:10px 14px}
.tick.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.primary{width:100%;min-height:56px;border-radius:999px;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);font-weight:700;font-size:1.05rem}
.hw-sent{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:14px;padding:12px 14px;text-align:center}
.note{color:var(--muted);font-size:.92rem;text-align:center}
/* reward pop-up */
.pop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(35,24,21,.35);padding:24px}
.pop[hidden]{display:none}
.pop .in{background:var(--card);border-radius:26px;padding:20px 22px 22px;display:grid;justify-items:center;gap:10px;max-width:300px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.4,.4,1) both}
.pop img{width:150px;height:150px;object-fit:cover;border-radius:50%;background:var(--butter-soft);animation:wiggle 1.2s ease-in-out .35s 2}
.pop b{font-family:var(--display);font-size:1.7rem;line-height:1.1;text-align:center}
.pop button{min-height:48px;border-radius:999px;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);font-weight:700;padding:0 26px}
@keyframes popin{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){.pop .in,.pop img{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../" data-hw-back>← My English</a>
  <div><p class="eyebrow">Домашнее задание · до вторника, 17 ноября</p><h1>Last week and the weekend</h1></div>
  <div class="tabs" id="tabs"></div>
  <main id="app" style="display:grid;gap:16px"></main>
</div>
<div class="pop" id="pop" hidden><div class="in"><img id="popImg" alt=""><b id="popTxt"></b><button type="button" id="popBtn">Next</button></div></div>
<script src="../../../kit/hw.js"></script>
<script>
/* Inna · hw6 · lesson of Fri 13 Nov 2026 */
const EX = [
  { name: "Past simple: fix the verb", tab: "1 · Past",
    how: "Это ваши предложения с урока. Выберите правильную форму глагола в прошедшем времени.",
    items: [
      { pre: "Ivan ", w: "want", post: " me to buy a present for Alexei.", a: "wanted", d: ["want", "wants"] },
      { pre: "In Turkey, we ", w: "buy", post: " two LEGO sets.", a: "bought", d: ["buyed", "buy"] },
      { pre: "We ", w: "haven't", post: " time for the Land of Legends.", a: "didn't have", d: ["haven't", "didn't had"] },
      { pre: "In Istanbul, we ", w: "have", post: " bad weather.", a: "had", d: ["have", "haved"] },
      { pre: "We ", w: "go", post: " to the palace.", a: "went", d: ["goed", "go"] },
      { pre: "Then we ", w: "go", post: " on a boat trip.", a: "went", d: ["goed", "go"] },
      { pre: "Ilya ", w: "want", post: " me to apply for a visa for his children.", a: "wanted", d: ["want", "wants"] }
    ] },
  { name: "Good sentences: choose the word", tab: "2 · Words",
    how: "Выберите слово, которое подходит. Все предложения — с нашего урока.",
    items: [
      { parts: ["I want to ", " Roma ", " at his grandparents."], a: "drop … off", d: ["pick … up", "check … in"] },
      { parts: ["I need to ", " Taras and Vladimir ", " for their flight."], a: "check … in", d: ["check … out", "drop … off"] },
      { parts: ["Ilya wanted me to apply ", " a visa."], a: "for", d: ["to", "(nothing)"] },
      { parts: ["The guests have been ", " our warehouse."], a: "to", d: ["in", "at"] },
      { parts: ["I wanted Roma to ", " new friends."], a: "make", d: ["have", "do"] },
      { parts: ["The palace didn't ", " my expectations."], a: "live up to", d: ["live up", "leave up to"] },
      { parts: ["When Ivan travels with his family, they usually take a ", " tour."], a: "guided", d: ["guide", "guiding"] },
      { parts: ["Roma likes theme parks, but he's afraid ", " water parks."], a: "of", d: ["from", "with"] }
    ] }
];
/* Reward characters. Misha (her dog) is added here once Stacy sends his photo: {img:"img/misha.webp", who:"misha"} */
const POPS = [
  { img: "../cats/miso.webp", lines: ["Good job, Inna!", "Miso approves."] },
  { img: "../cats/nori.webp", lines: ["Keep going!", "Nori is impressed!"] }
];

const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const newItems = ex => ex.items.map(it => ({ order: shuffle([it.a].concat(it.d)), tries: [], ok: false, shown: false }));
const S = { tab: 0, pos: [0, 0], ex: EX.map(newItems), fin: [false, false], voice: false, pops: 0 };

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const answered = st => st.ok || st.shown;
const exDone = e => S.ex[e].every(answered);

function sentenceHTML(e, it, st) {
  const fin = answered(st);
  if (e === 0) return esc(it.pre) + (fin ? '<span class="fill">' + esc(it.a) + '</span>' : '<span class="wrongv">' + esc(it.w) + '</span>') + esc(it.post);
  const p = it.parts;
  if (p.length === 3) {
    const [x, y] = it.a.split(" … ");
    return esc(p[0]) + (fin ? '<span class="fill">' + esc(x) + '</span>' : '<span class="gap">___</span>') + esc(p[1]) + (fin ? '<span class="fill">' + esc(y) + '</span>' : '<span class="gap">___</span>') + esc(p[2]);
  }
  const fill = it.a === "(nothing)" ? "" : it.a;
  return esc(p[0].replace(/ $/, fin && !fill ? "" : " ")) + (fin ? (fill ? '<span class="fill">' + esc(fill) + '</span>' : "") : '<span class="gap">___</span>') + esc(p[1]);
}

function pick(e, i, opt) {
  const it = EX[e].items[i], st = S.ex[e][i];
  if (answered(st) || st.tries.indexOf(opt) >= 0 || HW.preview) return;
  st.tries.push(opt);
  if (opt === it.a) st.ok = true; else if (st.tries.length >= 2) st.shown = true;
  render();
}

function next(e) {
  const n = EX[e].items.length;
  if (S.pos[e] < n - 1) { S.pos[e]++; render(); return; }
  if (!S.fin[e]) { S.fin[e] = true; S.pos[e] = n; render(); reward(); return; }
  S.pos[e] = n; render();
}

function reward() {
  const p = POPS[S.pops % POPS.length]; S.pops++; HW.save();
  $("popImg").src = p.img; $("popTxt").textContent = p.lines[Math.floor(Math.random() * p.lines.length)];
  $("pop").hidden = false;
}
$("popBtn").onclick = () => { $("pop").hidden = true; if (S.tab < 2) { S.tab++; render(); window.scrollTo(0, 0); } };

function renderTabs() {
  $("tabs").innerHTML = ["1 · Past", "2 · Words", "3 · Voice"].map((t, k) =>
    '<button type="button" data-t="' + k + '" class="' + (S.tab === k ? "on " : "") + ((k < 2 ? S.fin[k] : S.voice) ? "fin" : "") + '">' + t + ((k < 2 ? S.fin[k] : S.voice) ? " ✓" : "") + '</button>').join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = +b.dataset.t; render(); });
}

function renderEx(e) {
  const app = $("app"), ex = EX[e], n = ex.items.length, pos = Math.min(S.pos[e], n);
  let h = '<p class="how">' + esc(ex.how) + '</p>';
  if (pos >= n) {
    const first = S.ex[e].filter(st => st.ok && st.tries.length === 1).length;
    h += '<div class="card done"><b>Finished!</b><p>' + first + ' of ' + n + ' right first time.</p>' +
      '<div class="nav"><button type="button" class="ghost" id="again">Look again</button>' +
      '<button type="button" id="go">' + (e === 0 ? "Exercise 2 →" : "Exercise 3 →") + '</button></div></div>';
    app.innerHTML = h;
    $("again").onclick = () => { S.pos[e] = 0; render(); };
    $("go").onclick = () => { S.tab = e + 1; render(); window.scrollTo(0, 0); };
    return;
  }
  const it = ex.items[pos], st = S.ex[e][pos], fin = answered(st);
  h += '<div class="card"><div style="display:grid;gap:6px"><span class="count">' + (pos + 1) + ' / ' + n + '</span><div class="bar"><i style="width:' + Math.round(pos / n * 100) + '%"></i></div></div>' +
    '<p class="sent" lang="en">' + sentenceHTML(e, it, st) + '</p><div class="opts" lang="en">' +
    st.order.map(o => {
      const tried = st.tries.indexOf(o) >= 0, cls = (o === it.a && fin) ? "right" : tried ? "wrong" : "";
      return '<button type="button" class="opt ' + cls + '" data-o="' + esc(o) + '"' + (fin || tried ? " disabled" : "") + '>' + esc(o) + '</button>';
    }).join("") + '</div>';
  if (st.ok) h += '<p class="fb good" lang="en">' + (st.tries.length === 1 ? "Correct!" : "Yes, that's it!") + '</p>';
  else if (st.shown) h += '<p class="fb bad" lang="en">Not quite. The answer is: <b>' + esc(it.a) + '</b></p>';
  else if (st.tries.length) h += '<p class="fb bad" lang="en">Not quite. Try again.</p>';
  h += '<div class="nav"><button type="button" class="ghost" id="prev"' + (pos ? "" : " disabled") + '>←</button>' +
    '<button type="button" id="nx"' + (fin ? "" : " disabled") + '>' + (pos === n - 1 ? "Finish" : "Next →") + '</button></div></div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(e, pos, b.dataset.o));
  $("prev").onclick = () => { if (S.pos[e] > 0) { S.pos[e]--; render(); } };
  $("nx").onclick = () => next(e);
}

function renderVoice() {
  const app = $("app");
  app.innerHTML = '<p class="how">Запишите голосовое сообщение (около 1 минуты) и отправьте мне в Telegram. Ответьте на два вопроса. Не читайте с листа — говорите своими словами.</p>' +
    '<div class="card"><ol class="qs" lang="en"><li>What did Ivan or Ilya want you to do last week?</li><li>What did you do at the weekend?</li></ol>' +
    '<div class="stems" lang="en"><b>You can start like this</b><span>Ivan / Ilya wanted me to …</span><span>At the weekend, I …</span></div>' +
    '<button type="button" class="tick' + (S.voice ? " on" : "") + '" id="vt">' + (S.voice ? "✓ Голосовое отправлено" : "Я отправила голосовое") + '</button></div>' +
    '<div id="send"></div>' +
    (!HW.submitted && !(S.fin[0] && S.fin[1]) ? '<p class="note">Когда закончите все три задания, нажмите «Готово».</p>' : "");
  $("vt").onclick = () => { if (HW.preview) return; S.voice = !S.voice; render(); };
  const sb = HW.sendBlock(); if (sb.className === "hw-sent") sb.textContent = "Отправлено ✓ Stacy видит ваши ответы.";
  $("send").appendChild(sb);
}

function render() {
  renderTabs();
  if (S.tab < 2) renderEx(S.tab); else renderVoice();
  HW.save();
}

function exSummary(e) {
  const ex = EX[e], sts = S.ex[e], first = sts.filter(st => st.ok && st.tries.length === 1).length;
  const lines = ["Task " + (e + 1) + " · " + ex.name, first + " of " + ex.items.length + " right first time"];
  ex.items.forEach((it, i) => {
    const st = sts[i], s = e === 0 ? it.pre + "[" + it.a + "]" + it.post : it.parts.join(" ___ ").replace(/\s+/g, " ");
    lines.push((i + 1) + ". " + s.trim() + " → " + (!st.tries.length ? "— not answered" :
      (st.ok ? "✓ " : "✗ ") + st.tries.join(" → ") + " (" + st.tries.length + (st.tries.length === 1 ? " try" : " tries") + ")" + (st.shown ? ", answer shown" : "")));
  });
  return lines;
}

HW.start({
  id: "hw6", title: "Last week and the weekend",
  get: () => S,
  set: z => {
    if (!z) return;
    if (Array.isArray(z.ex) && z.ex.length === EX.length) z.ex.forEach((arr, e) => { if (Array.isArray(arr) && arr.length === EX[e].items.length) S.ex[e] = arr; });
    if (Array.isArray(z.pos) && z.pos.length === 2) S.pos = z.pos.map((p, e) => Math.max(0, Math.min(+p || 0, EX[e].items.length)));
    if (Array.isArray(z.fin) && z.fin.length === 2) S.fin = z.fin.map(Boolean);
    S.tab = [0, 1, 2].indexOf(z.tab) >= 0 ? z.tab : 0; S.voice = !!z.voice; S.pops = +z.pops || 0;
  },
  summary: () => exSummary(0).concat([""], exSummary(1), ["", "Task 3 · Voice message",
    (S.voice ? "✓ She ticked: voice message sent in Telegram" : "✗ Not ticked as sent yet") + " — check your Telegram"]).join("\n"),
  render
});
</script>
</body>
</html>
