<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teacher view</title>
<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Karla";src:url(fonts/karla-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Karla";src:url(fonts/karla-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--ivory:#F6F1E7;--java:#231815;--choc:#643A24;--butter:#F4DC96;--powder:#C1DBE8;--sand:#CCBB9F;--sandl:#EDE4D4;--sceptre:#4D0E12;--pink:#F1DEDA;--ok:#2F6B3A;--okbg:#DCEBD8}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--java);font:400 16px/1.5 Karla,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
h1,h2,h3{font-family:Bricolage,Karla,sans-serif;font-weight:700;margin:0}
h1{font-size:26px} h2{font-size:21px;margin:28px 0 8px} h3{font-size:17px}
.card{background:#fff;border:1px solid var(--sandl);border-radius:16px;padding:14px;margin:10px 0}
.muted{color:var(--choc);opacity:.85;font-size:14px}
.pill{font:600 12px Karla;padding:3px 9px;border-radius:99px;background:var(--powder);white-space:nowrap}
.pill.done{background:var(--okbg);color:var(--ok)} .pill.draft{background:var(--sandl)} .pill.late{background:var(--pink);color:var(--sceptre)}
.head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details summary{cursor:pointer;list-style:none} details summary::-webkit-details-marker{display:none}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
td{padding:6px 4px;border-top:1px solid var(--sandl);vertical-align:top}
td.m{width:28px;text-align:center}
.ok{color:var(--ok);font-weight:600} .no{color:var(--sceptre);font-weight:600}
.resp{white-space:pre-wrap}
input[type=date]{font:400 14px Karla;border:1px solid var(--sandl);border-radius:8px;padding:5px 6px;margin-left:6px}
button{font:600 14px Karla;border:0;border-radius:10px;padding:7px 11px;background:var(--sandl);color:var(--java);cursor:pointer}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.num{width:64px;font:400 14px Karla;border:1px solid var(--sandl);border-radius:8px;padding:5px 6px;margin-left:6px}
button.primary{background:var(--java);color:var(--ivory)}
textarea.note{width:100%;font:400 15px/1.45 Karla;border:1px solid var(--sandl);border-radius:10px;padding:8px 10px;margin-top:8px;resize:vertical;background:#fff;color:var(--java)}
.hint{font-size:13px;color:var(--choc);opacity:.75;margin-top:4px}
.stu{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:#fff;border:1px solid var(--sandl);border-radius:16px;padding:16px;margin:10px 0;font:400 16px/1.4 Karla,system-ui,sans-serif}
.stu-top{display:flex;justify-content:space-between;align-items:center}
.stu b{font:700 20px Bricolage,Karla,sans-serif}.chev{font-size:26px;line-height:1;color:var(--sand)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.back{background:none;padding:6px 0;font-size:15px;color:var(--choc);margin-bottom:6px}
.links button{min-height:40px}
.answers{margin-top:10px;font-size:15px;border-top:1px solid var(--sandl);padding-top:8px}
.answers div{padding:3px 0}.answers .tt{font-weight:600;margin-top:8px}
.ok2{color:var(--ok)}.no2{color:var(--sceptre)}
details summary b{font-weight:600}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
var API = "https://nrnjubhnpaicuokidnjl.supabase.co/functions/v1/app";
function tgPost(type){ try{ if (window.TelegramWebviewProxy) TelegramWebviewProxy.postEvent(type, "{}"); }catch(e){} }
var AUTH = null;
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), init = h.get("tgWebAppData"), k = h.get("k");
  if (init){ AUTH = "tg " + init; return; }
  if (k){ try{ localStorage.setItem("teacherKey", k); }catch(e){} history.replaceState(null, "", location.pathname); AUTH = "key " + k; return; }
  try{ var s = localStorage.getItem("teacherKey"); if (s) AUTH = "key " + s; }catch(e){}
})();
tgPost("web_app_ready"); tgPost("web_app_expand");
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var when = function(t){ return t ? new Date(t).toLocaleString("en-GB", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : ""; };
function copy(text, b){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(function(){}); var o = b.textContent; b.textContent = "Copied ✓"; setTimeout(function(){ b.textContent = o; }, 1500); }

function itemText(t, it){
  if (t.type === "gap") return it.text;
  if (t.type === "choice") return (it.text ? it.text + " — " : "") + it.options.map(function(o, i){ return i === it.answer ? "[" + o + "]" : o; }).join(" / ");
  if (t.type === "order") return "→ " + [].concat(it.answer)[0];
  if (t.type === "write") return it.stem;
  if (t.type === "voice") return it.prompt;
  return "";
}
function showResp(t, it, r){
  if (t.type === "choice") return it.options[Number(r)];
  return Array.isArray(r) ? r.join(" / ") : r;
}



// "Sat 08:15" list; a one-week change ({from, until} on the same day) shows as "Sat 14 Nov 10:40 (this week only)"
function lessonLabel(P, short){
  var today = new Date().toISOString().slice(0, 10), seen = {}, out = [];
  (P.lessons || []).forEach(function(l){
    if (l.until && l.until < today) return;
    var one = l.from && l.from === l.until, day = short ? l.day.slice(0, 3) : l.day;
    var txt = one ? day.slice(0, 3) + " " + new Date(l.from + "T12:00:00Z").toLocaleDateString("en-GB", {day: "numeric", month: "short", timeZone: "UTC"}) + " " + l.time + " (this week only)" : day + " " + l.time;
    if (!seen[txt]) { seen[txt] = 1; one ? out.unshift(txt) : out.push(txt); }
  });
  return out.join(" · ");
}
// lessons taught so far in the current package (same rule as her page: weekly schedule from the start date, minus cancelled, plus extra dates)
function taughtCount(P){
  var K = P.pack || {}; if (!K.start) return null;
  var W = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], days = {}, skip = {}, add = {};
  (P.lessons || []).forEach(function(l){ days[l.day] = 1; });
  (K.skip || []).concat(P.cancel || []).forEach(function(d){ skip[d] = 1; }); (K.add || []).forEach(function(d){ add[d] = 1; });
  var today = new Intl.DateTimeFormat("en-CA", {timeZone: P.tzName || "Europe/Moscow"}).format(new Date()), n = 0;
  for (var t = Date.parse(K.start + "T12:00:00Z"), i = 0; i < 400; i++, t += 864e5){
    var iso = new Date(t).toISOString().slice(0, 10); if (iso > today) break;
    if ((days[W[new Date(t).getUTCDay()]] && !skip[iso]) || add[iso]) n++;
  }
  return Math.min(n, Number(K.size) || n);
}
var CUR = null, DATA = null;   // CUR = id of the student that is open (null = list of students)
function who(P){ var he = P.paidBtn === "Я оплатил"; return {his: he ? "his" : "her", he: he ? "he" : "she", He: he ? "He" : "She", him: he ? "him" : "her"}; }
function shortDate(iso){ return iso ? new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"}) : "—"; }
function payPill(s){ var K = (s.profile || {}).pack || {};
  return s.pay_check_at ? '<span class="pill late">Says paid — check</span>' : K.paid ? '<span class="pill done">Paid ✓</span>' : '<span class="pill late">Not paid</span>'; }
// homework list for a student: items on the page (profile.homework) joined with saved answers (summary.hw)
function hwList(s, sm){
  var P = s.profile || {}, saved = {}, ticked = ((sm || {}).hwTicked) || {};
  ((sm || {}).hw || []).forEach(function(w){ saved[w.id] = w; });
  var out = (P.homework || []).map(function(h){ var w = saved[h.id]; delete saved[h.id];
    return {id: h.id, title: h.title, due: h.due, url: h.url, w: w, done: !!h.done || !!(w && w.submitted) || !!ticked[h.id], old: !!h.done && !w}; });
  Object.keys(saved).forEach(function(id){ out.push({id: id, title: saved[id].title, w: saved[id], done: saved[id].submitted}); });
  return out;
}
function hwState(x){ return x.w && x.w.submitted ? "finished" : x.w ? "progress" : x.done ? "done" : "open"; }
function hwPill(x){ var st = hwState(x);
  return st === "finished" ? '<span class="pill done">Finished ✓</span>' : st === "progress" ? '<span class="pill">In progress</span>'
    : st === "done" ? '<span class="pill done">Done ✓</span>' : '<span class="pill draft">Not started</span>'; }

function homeView(d){
  var html = '<h1>My students</h1><div class="muted">Tap a student to open everything about them.</div>';
  d.students.forEach(function(s){
    var sm = (d.summary || {})[s.id] || {}, P = s.profile || {}, c = sm.cards || {};
    var hw = hwList(s, sm).filter(function(x){ return !x.old; }), cur = hw[0];
    var lessons = lessonLabel(P, true);
    html += '<button class="stu" data-open="' + s.id + '"><span class="stu-top"><b>' + esc(s.name) + '</b><span class="chev">›</span></span>' +
      '<span class="muted">' + esc(lessons || "No lessons set") + (s.tg_user_id ? '' : ' · not connected yet') + '</span>' +
      '<span class="pills">' + payPill(s) +
      (cur ? '<span class="pill' + (hwState(cur) === "finished" || hwState(cur) === "done" ? ' done' : hwState(cur) === "open" ? ' draft' : '') + '">Homework: ' +
        ({finished: "finished ✓", progress: "in progress", done: "done ✓", open: "not started"})[hwState(cur)] + '</span>' : '') +
      '<span class="pill' + (c.doneToday ? ' done">Practised today ✓' : '">Cards: ' + (c.learned || 0) + ' / ' + (c.total || 0)) + '</span>' +
      (P.remindersOff ? '<span class="pill late">Reminders off</span>' : '') + '</span></button>';
  });
  return html;
}

function studentView(d, s){
  var sm = (d.summary || {})[s.id] || {}, c = sm.cards || {}, dy = sm.diary || {}, P = s.profile || {}, K = P.pack || {}, W = who(P);
  var base = s.link.split("#")[0], key = s.link.split("#k=")[1] || "";
  var h = '<button class="back" data-back="1">‹ All students</button><h1>' + esc(s.name) + '</h1>' +
    '<div class="muted">' + esc(lessonLabel(P, false)) + ' · ' + esc(s.tz) + ' · ' + (s.tg_user_id ? "Telegram connected ✓" : "Telegram not connected yet") + '</div>' +
    '<div class="links"><a href="' + esc(s.link.replace('#k=', '?preview=1#k=')) + '" target="_blank" rel="noopener"><button class="primary">Open ' + W.his + ' page</button></a>' +
    (s.telegramLink ? '<button data-copy="' + esc(s.telegramLink) + '">Copy Telegram link</button>' : '') + '<button data-copy="' + esc(s.link) + '">Copy web link</button></div>';

  // ---- Homework
  var hw = hwList(s, sm), cur = hw.filter(function(x){ return !x.old; }), old = hw.filter(function(x){ return x.old; });
  h += '<h2>Homework</h2>';
  if (!cur.length) h += '<div class="card muted">No homework on ' + W.his + ' page right now.</div>';
  cur.forEach(function(x){
    var open = x.url && !/^https?:/.test(x.url) ? base + x.url + '?preview=1&k=' + key : null;
    h += '<div class="card"><div class="head"><h3>' + esc(x.title) + '</h3>' + hwPill(x) + '</div>' +
      '<div class="muted">' + (x.due ? 'Due ' + esc(shortDate(x.due)) : '') + (x.w ? (x.due ? ' · ' : '') + 'last saved ' + esc(when(x.w.updated)) : '') + '</div>';
    if (x.w) {
      h += '<div class="resp answers">' + fmtSummary(x.w.summary) + '</div>';
      if (open) h += '<div class="links"><a href="' + esc(open) + '" target="_blank" rel="noopener"><button class="primary">Open it the way ' + W.he + ' did it</button></a></div>' +
        '<div class="hint">Opens the homework with ' + W.his + ' answers filled in. Nothing you tap there is saved.</div>';
    } else h += '<div class="hint">' + (open ? W.He + ' hasn’t opened it yet. Answers will show here as soon as ' + W.he + ' starts.' : 'This one opens outside the app, so answers aren’t saved here.') + '</div>';
    h += '</div>';
  });
  if (old.length) h += '<details class="card"><summary><b>Earlier homework (' + old.length + ')</b> <span class="muted">· tap to show</span></summary>' +
    old.map(function(x){ return '<div style="margin-top:8px">' + esc(x.title) + ' <span class="pill done">Done ✓</span></div>'; }).join("") + '</details>';

  // ---- Focus of the week
  h += '<h2>Focus of the week</h2><div class="card"><div class="head"><span class="muted">Shows at the top of ' + W.his + ' page</span>' + (P.note ? '<span class="pill done">On ' + W.his + ' page</span>' : '<span class="pill draft">Empty</span>') + '</div>' +
       '<textarea class="note" data-note="' + s.id + '" rows="5" placeholder="What to focus on this week, or a short message…">' + esc(P.note || "") + '</textarea>' +
       '<div class="links"><button class="primary" data-save-note="' + s.id + '">Save</button>' + (P.note ? '<button data-clear-note="' + s.id + '">Remove</button>' : '') + '</div>' +
       '<div class="hint">On your phone, tap the 🎤 on the keyboard to dictate.</div></div>';

  // ---- Payment
  var taught = taughtCount(P);
  h += '<h2>Package & payment</h2><div class="card"><div class="head"><b>' + (taught !== null ? taught + ' of ' + (K.size || "?") + ' lessons taught' : 'No package set') + '</b>' + payPill(s) + '</div>' +
       '<div style="margin-top:6px">Next payment: <b>' + esc(shortDate(P.nextPayment)) + '</b> <span class="muted">· ' + (P.nextPaymentManual ? 'set by you' : 'automatic') + '</span></div>' +
       // A paid package needs nothing. Starting the NEXT package by hand takes two taps (Nov 12: extra taps made extra packages).
       ((s.pay_check_at || !K.paid)
         ? '<div class="links"><button class="primary" data-markpaid="' + s.id + '">✓ Payment received</button></div><div class="hint">' +
           (s.pay_check_at ? W.He + ' tapped “I’ve paid”. Check Stripe, then tap this — once.' : 'Tap when the money arrives. Payment reminders stop and the next date is set automatically.') + '</div>'
         : '<div class="hint" style="margin-top:8px">This package is paid ✓ Nothing to do until the next payment date.</div>' +
           '<div class="links"><button data-markpaid="' + s.id + '" data-twice="1">Next package paid already?</button></div>' +
           '<div class="hint">Only if ' + esc(s.name) + ' paid for the next package without tapping “I’ve paid”.</div>') +
       '<details style="margin-top:12px"><summary><b>Change package or date</b> <span class="muted">· tap to show</span></summary>' +
       '<div class="links" style="align-items:center"><label class="muted">Lessons <input type="number" min="1" max="60" class="num" data-size="' + s.id + '" value="' + esc(K.size || "") + '"></label>' +
       '<label class="muted">from <input type="date" data-start="' + s.id + '" value="' + esc(K.start || "") + '"></label><button data-save-pack="' + s.id + '">Save package</button></div>' +
       '<div class="hint">' + (K.paid ? 'Paid ' + esc(K.paid) + '. ' : '') + 'Paying per lesson? Put the number of lessons paid for.</div>' +
       '<div class="links" style="align-items:center;margin-top:12px"><label class="muted">Next payment <input type="date" data-np="' + s.id + '" value="' + esc(P.nextPayment || "") + '"></label><button data-save-np="' + s.id + '">Change date</button>' +
       (P.nextPaymentManual ? '<button data-auto="' + s.id + '">Use automatic</button>' : '') + '</div>' +
       '<div class="hint">Automatic: an unpaid package is due at its first lesson; a paid one at the first lesson after it ends.</div></details></div>';

  // ---- Practice
  var LBL = {cards:"Cards", watch:"Watched", listen:"Listened", read:"Read", speak:"Spoke English", write:"Wrote", homework:"Homework", pron:"Pronunciation"};
  var wk = c.week || {}, wkParts = Object.keys(wk).map(function(k){ return (LBL[k] || k) + " " + wk[k]; });
  h += '<h2>Practice</h2><div class="card"><div class="head"><b>Cards</b><span class="pill">' + (c.learned || 0) + ' / ' + (c.total || 0) + ' practised</span></div>' +
       '<div class="muted">Today: ' + (c.doneToday || 0) + ' done · ' + (c.dueToday || 0) + ' waiting · last practice: ' + esc(c.lastPractice ? shortDate(c.lastPractice) : "—") + '</div>' +
       '<div style="margin-top:6px"><b>This week:</b> ' + (c.activeDays || 0) + ' active days' + (wkParts.length ? ' · ' + esc(wkParts.join(" · ")) : '') + '</div>' +
       (c.struggling && c.struggling.length ? '<div style="margin-top:6px"><b>Struggling with:</b> ' + c.struggling.map(esc).join(", ") + '</div>' : '') + '</div>';
  if (!P.noDiary) h += '<div class="card"><div class="head"><b>Diary</b><span class="pill">' + (dy.entries || 0) + ' entries</span></div>' +
       (dy.last ? '<div class="muted">' + esc(shortDate(dy.last.date)) + (dy.wroteToday ? ' · wrote today ✓' : '') + '</div><div class="resp" style="margin-top:6px">' + esc(dy.last.text) + '</div>' : '<div class="muted">No entries yet.</div>') + '</div>';

  // ---- Reminders
  h += '<h2>Reminders</h2><div class="card"><div class="head"><span class="muted">Cards, homework, lessons, payment</span><span class="pill' + (P.remindersOff ? ' late">Off' : ' done">On') + '</span></div>' +
       '<div class="links"><button data-remind="' + s.id + '" data-off="' + (P.remindersOff ? '0' : '1') + '">' + (P.remindersOff ? 'Turn reminders on' : 'Pause reminders') + '</button>' +
       '<button data-test="' + s.id + '">Show me ' + W.his + ' reminders</button></div>' +
       '<div class="hint">Pause for holidays. “Show me” sends you a copy of each message, so you can check the wording.</div></div>';
  return h;
}
// answers text → readable lines (✓ green, ✗ red, task titles bold)
function fmtSummary(t){
  return esc(t || "No answers yet.").split("\n").map(function(l){
    if (/^Task \d/.test(l)) return '<div class="tt">' + l + '</div>';
    if (!l.trim()) return '';
    var cls = /✗|not fixed|missed|answer shown/.test(l) ? ' class="no2"' : /✓/.test(l) ? ' class="ok2"' : '';
    return '<div' + cls + '>' + l + '</div>';
  }).join("");
}
function post(body){ return fetch(API + "/teacher", {method: "POST", headers: {"x-auth": AUTH, "content-type": "application/json"}, body: JSON.stringify(body)}).then(function(r){ if (!r.ok) throw r.status; }); }
function wireActions(){
  document.querySelectorAll("[data-save-np]").forEach(function(b){ b.onclick = function(){
    var id = b.dataset.saveNp, v = document.querySelector('[data-np="' + id + '"]').value || null;
    post({student_id: id, action: "profile", patch: {nextPayment: v}}).then(function(){ b.textContent = "Saved ✓"; setTimeout(load, 600); }).catch(function(){ b.textContent = "Error"; }); }; });
  document.querySelectorAll("[data-save-pack]").forEach(function(b){ b.onclick = function(){
    var id = b.dataset.savePack; b.disabled = true;
    post({student_id: id, action: "profile", patch: {packSize: Number(document.querySelector('[data-size="' + id + '"]').value) || undefined,
      packStart: document.querySelector('[data-start="' + id + '"]').value || undefined}}).then(load).catch(function(){ b.disabled = false; b.textContent = "Error"; }); }; });
  document.querySelectorAll("[data-save-note]").forEach(function(b){ b.onclick = function(){
    var id = b.dataset.saveNote; b.disabled = true;
    post({student_id: id, action: "profile", patch: {note: document.querySelector('[data-note="' + id + '"]').value.trim()}}).then(load).catch(function(){ b.disabled = false; b.textContent = "Error"; }); }; });
  document.querySelectorAll("[data-clear-note]").forEach(function(b){ b.onclick = function(){
    b.disabled = true; post({student_id: b.dataset.clearNote, action: "profile", patch: {note: ""}}).then(load); }; });
  document.querySelectorAll("[data-auto]").forEach(function(b){ b.onclick = function(){
    b.disabled = true; post({student_id: b.dataset.auto, action: "profile", patch: {autoPayment: true}}).then(load); }; });
  document.querySelectorAll("[data-markpaid]").forEach(function(b){ b.onclick = function(){
    if (b.dataset.twice && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again: start a new paid package"; b.classList.add("primary"); return; }
    var id = b.dataset.markpaid, n = Number((document.querySelector('[data-size="' + id + '"]') || {}).value) || undefined;
    b.disabled = true; post({student_id: id, action: "mark-paid", patch: {lessons: n}}).then(load).catch(function(){ b.disabled = false; b.textContent = "Error — try again"; }); }; });
  document.querySelectorAll("[data-remind]").forEach(function(b){ b.onclick = function(){
    b.disabled = true; post({student_id: b.dataset.remind, action: "profile", patch: {remindersOff: b.dataset.off === "1"}}).then(load).catch(function(){ b.disabled = false; }); }; });
  document.querySelectorAll("[data-test]").forEach(function(b){ b.onclick = function(){
    b.textContent = "Sending…";
    fetch(API + "/test-reminders?student=" + b.dataset.test, {headers: {"x-auth": AUTH}}).then(function(r){ return r.json(); })
      .then(function(j){ b.textContent = j.sent ? "Sent to your Telegram ✓" : "Error: " + (j.error || ""); })
      .catch(function(){ b.textContent = "Error"; }); }; });
}

function render(d){
  DATA = d;
  var s = CUR && d.students.filter(function(x){ return x.id === CUR; })[0];
  var y = window.scrollY;
  document.getElementById("app").innerHTML = s ? studentView(d, s) : homeView(d);
  document.querySelectorAll("[data-copy]").forEach(function(b){ b.onclick = function(){ copy(b.dataset.copy, b); }; });
  document.querySelectorAll("[data-open]").forEach(function(b){ b.onclick = function(){ CUR = b.dataset.open; try{ sessionStorage.setItem("teacherCur", CUR); }catch(e){} render(DATA); window.scrollTo(0, 0); }; });
  document.querySelectorAll("[data-back]").forEach(function(b){ b.onclick = function(){ CUR = null; try{ sessionStorage.removeItem("teacherCur"); }catch(e){} render(DATA); window.scrollTo(0, 0); }; });
  wireActions();
  if (s) window.scrollTo(0, y);
}
try{ CUR = sessionStorage.getItem("teacherCur") || null; }catch(e){}

if (!AUTH) document.getElementById("app").innerHTML = '<p>Open this from the bot, or with your private teacher link.</p>';
else load();
function load(){ return fetch(API + "/teacher", {headers: {"x-auth": AUTH}}).then(function(r){ if (!r.ok) throw r.status; return r.json(); }).then(render)
  .catch(function(e){ document.getElementById("app").innerHTML = '<p>' + (e === 401 ? "Not authorised." : "Couldn't load — try again.") + '</p>'; }); }
</script>
