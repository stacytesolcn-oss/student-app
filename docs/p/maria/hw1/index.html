<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>My week: do, take, make, have</title>
<style>
:root{
  --bg:#F6F1E7; --card:#FCFAF5; --ink:#231815; --muted:#6E5C52; --line:#E3D9C8;
  --brown:#643A24; --on-brown:#F6F1E7; --butter:#F4DC96; --butter-soft:#FAF0CF;
  --blue-soft:#E3EEF4; --sand:#CCBB9F; --sand-soft:#EDE4D4; --pink:#F1DEDA;
  --ok:#2F6B3A; --ok-soft:#DCEBD8; --bad:#8A2A1E; --bad-soft:#F6DDD8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 80px}
a.back{color:var(--brown);font-weight:600;text-decoration:none}
header h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:10px 0 2px}
header p{margin:0;color:var(--muted);font-size:14px}
.progress{display:flex;gap:6px;margin:14px 0 16px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--brown)}
.head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.head .n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.head h2{font:700 21px/1.2 Georgia,serif;margin:2px 0 6px}
.head p{margin:0;font-size:15px}
.head p+p{margin-top:6px}
.btn{font:700 16px/1 inherit;font-family:inherit;border:0;border-radius:12px;padding:12px 18px;min-height:46px;background:var(--brown);color:var(--on-brown);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
/* step 1 */
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.box{background:var(--card);border:2px solid var(--sand);border-radius:14px;padding:10px;min-height:86px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.box b{display:block;font:700 20px Georgia,serif;margin-bottom:4px}
.box.armed{border-color:var(--brown);background:var(--butter-soft)}
.box .got{display:block;font-size:14px;color:var(--ok)}
.bank{background:var(--sand-soft);border-radius:14px;padding:12px}
.bank .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px inherit;font-family:inherit;min-height:42px;padding:8px 12px;border-radius:999px;border:2px solid var(--sand);background:var(--card);color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--brown);background:var(--brown);color:var(--on-brown)}
.msg{min-height:24px;margin:10px 2px 0;font-size:15px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
/* step 2 */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sent{line-height:2.5;font-size:17px}
.gap{display:inline-block;vertical-align:middle}
.gap input{font:500 16px inherit;font-family:inherit;width:var(--w);min-width:4ch;padding:5px 6px;border:2px solid var(--sand);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
.gap input.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;margin-top:4px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--brown);font:600 15px inherit;font-family:inherit;text-decoration:underline;cursor:pointer}
/* steps 3-4 */
.stems{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.stems p{margin:0;font-weight:600}
.stems p+p{margin-top:8px}
.wb{background:var(--sand-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.wb summary{font-weight:700;cursor:pointer}
.wb .row{margin-top:8px}
.wb .row span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.voice{background:var(--pink);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.voice p{margin:0}
label.chk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
label.chk input{width:22px;height:22px}
label.stem{display:block;font-weight:600;margin:12px 0 6px}
textarea{width:100%;min-height:64px;font:16px/1.4 inherit;font-family:inherit;padding:10px;border:2px solid var(--sand);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}
.hw-sent{background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:12px;padding:12px 14px}
.btn.primary{width:100%}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../" data-hw-back>← My English</a>
  <header>
    <h1>My week: do, take, make, have</h1>
    <p>Фразы с нашего первого урока · около 30 минут</p>
  </header>
  <div class="progress" id="progress"></div>
  <main id="app"></main>
</div>
<script src="../../../kit/hw.js"></script>
<script>
/* ---------- data ---------- */
const VERBS = ["do","take","make","have","prefer","get"];
const SORT = [
  {p:"my morning routine", a:["do"]},
  {p:"a face mask", a:["do"]},
  {p:"yoga", a:["do"]},
  {p:"exercises", a:["do"]},
  {p:"a shower", a:["take"]},
  {p:"photos", a:["take"]},
  {p:"breakfast with my boyfriend", a:["make","have"]},
  {p:"breakfast at home", a:["have"]},
  {p:"breakfast at work", a:["have"]},
  {p:"breakfast in a café", a:["have"]},
  {p:"time to …", a:["have"]},
  {p:"the energy to …", a:["have"]},
  {p:"black coffee", a:["prefer","have"]},
  {p:"a savory breakfast", a:["prefer","have","make"]},
  {p:"itchy feet", a:["get"]}
];
/* [word] = gap; the student sees the first and last letter */
const GAPS = [
  "On weekdays, I usually [have] breakfast at [work].",
  "On weekends, I often [do] my morning [routine].",
  "I sometimes [do] a face [mask] in the evening.",
  "On weekdays, I don't [have] [time] to do yoga in the morning.",
  "After work, I only [have] the [energy] to scroll Instagram.",
  "On weekends, my boyfriend and I [make] [breakfast] together.",
  "When I travel, I always [take] a lot of [photos].",
  "When I see travel photos, I [get] [itchy] [feet]."
];
const GAPW = GAPS.map(s => [...s.matchAll(/\[(.+?)\]/g)].map(m => m[1]));
const PHR = ["do my morning routine","do a face mask","do yoga","do exercises","take a shower","make breakfast","have breakfast at home","have breakfast at work","have breakfast in a café","go for a walk","come home late","scroll Instagram","(don't) have time to …","(don't) have the energy to …","see cinematic travel photos","watch my colleague's stories from Japan","see a new café with a beautiful interior","get itchy feet"];
const NG = 4;
const ME = ["What is a normal weekday like for you? What don't you have time to do?","What do you usually do on weekends?","When do you get itchy feet?"];
const BF = ["What is a normal weekday like for him? What doesn't he have time to do?","What does he usually do on weekends?","When does he get itchy feet?"];

/* ---------- state ---------- */
const S = {
  step: 0,
  sort: SORT.map(() => ({tries: [], done: false, shown: false, v: ""})),
  gaps: GAPS.map((_, i) => ({vals: GAPW[i].map(() => ""), tries: [], ok: false, shown: false})),
  groups: Array.from({length: NG}, () => ({name: "", items: []})),
  voice: false,
  like: "", voice2: false,
  bf: BF.map(() => "")
};
let armed = null; // index of the selected phrase in step 1
const STEPS = 6; // + final screen
const norm = s => String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function head(n, title, ps){
  const h = el("div","head");
  h.append(el("div","n", n ? "Шаг "+n+" из "+STEPS : "Готово"), el("h2","",title));
  ps.forEach(p => h.append(el("p","",p)));
  return h;
}
function nav(app, canNext){
  const n = el("div","nav");
  const b = el("button","btn ghost","← Назад"); b.onclick = () => go(S.step-1);
  b.style.visibility = S.step ? "visible" : "hidden";
  const f = el("button","btn", S.step === STEPS-1 ? "Завершить →" : "Дальше →"); f.onclick = () => go(S.step+1);
  n.append(b, f); app.append(n);
}
function go(n){ S.step = Math.max(0, Math.min(STEPS, n)); armed = null; armedP = null; render(); window.scrollTo(0,0); }
function wordBank(open){
  const d = el("details","wb"); if (open) d.open = true;
  d.innerHTML = '<summary>Нужна помощь? Открой банк слов</summary>'+
    '<div class="row"><span>Фразы</span>do my morning routine · do a face mask · do yoga · do exercises · take a shower · take photos · make breakfast · have breakfast at home / at work / in a café · (don\'t) have time to … · (don\'t) have the energy to … · prefer black coffee · get itchy feet</div>'+
    '<div class="row"><span>Как часто</span>always · usually · often · sometimes · rarely · never</div>'+
    '<div class="row"><span>Когда</span>on weekdays · on weekends · in the morning · in the evening · after work · when I travel</div>';
  return d;
}

/* ---------- step 1: sort ---------- */
function step1(app){
  app.append(head(1, "Which verb?", ["Сначала посмотри на шесть глаголов. Потом нажми на фразу внизу и на глагол, с которым она сочетается."]));
  const boxes = el("div","boxes");
  VERBS.forEach(v => {
    const b = el("button","box"+(armed!=null?" armed":""));
    b.innerHTML = "<b>"+v+"</b>" + SORT.map((it,i)=>S.sort[i].done && S.sort[i].v===v ? '<span class="got">'+esc(it.p)+'</span>' : "").join("");
    b.onclick = () => place(v);
    boxes.append(b);
  });
  app.append(boxes);
  const bank = el("div","bank"); bank.append(el("div","lab","Фразы"));
  const chips = el("div","chips");
  SORT.forEach((it,i) => { if (S.sort[i].done) return;
    const c = el("button","chip"+(armed===i?" sel":""), esc(it.p)); c.onclick = () => { armed = (armed===i?null:i); render(); };
    chips.append(c); });
  if (!chips.children.length) chips.append(el("span","", "Всё готово! ✓"));
  bank.append(chips); app.append(bank);
  app.append(el("div","msg"+(step1.msg?(" "+step1.msg[0]):""), step1.msg?esc(step1.msg[1]):(armed!=null?"Теперь нажми на глагол.":"")));
  nav(app);
}
function place(v){
  if (armed == null){ step1.msg = ["bad","Сначала нажми на фразу."]; render(); return; }
  const i = armed, st = S.sort[i], it = SORT[i];
  st.tries.push(v);
  if (it.a.includes(v)){ st.done = true; st.v = v; armed = null;
    step1.msg = ["ok","✓ "+v+" "+it.p+(it.a.length>1?"  (можно и так: "+it.a.filter(x=>x!==v).join(" / ")+" "+it.p+")":"")]; }
  else if (st.tries.length >= 2){ st.done = true; st.shown = true; st.v = it.a[0]; armed = null;
    step1.msg = ["bad","Правильно: "+it.a[0]+" "+it.p+". Запомни!"]; }
  else step1.msg = ["bad","Не "+v+". Попробуй другой глагол."];
  render();
}

/* ---------- step 2: gaps ---------- */
function ph(w){
  if (w.length <= 2) return w[0]+" _";
  if (w.length >= 4 && /[^s]s$/.test(w)) return w[0]+" "+"_ ".repeat(w.length-3)+w.slice(-2);
  return w[0]+" "+"_ ".repeat(w.length-2)+w[w.length-1];
}
function step2(app){
  app.append(head(2, "Fill the gaps", ["Это предложения про твою неделю. Впиши пропущенные слова: видны первая и последняя буквы.", "Не помнишь фразу?"]));
  const lk = el("button","link","Вернись к шагу 1"); lk.onclick = () => go(0); app.querySelector(".head p:last-child").append(" ", lk);
  GAPS.forEach((s, i) => {
    const st = S.gaps[i], box = el("div","item"); let k = 0;
    const html = (i+1)+". "+esc(s).replace(/\[(.+?)\]/g, (_, w) => { const j = k++; const p = ph(w);
      return '<span class="gap"><input data-i="'+i+'" data-j="'+j+'" placeholder="'+p+'" style="--w:'+(p.length+2)+'ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="missing word"></span>'; });
    const sent = el("div","sent", html); box.append(sent);
    sent.querySelectorAll("input").forEach(inp => { const j = +inp.dataset.j;
      inp.value = st.vals[j]; inp.disabled = st.ok || st.shown;
      if (st.ok || st.shown) inp.className = "ok";
      else if (st.tries.length) inp.className = norm(st.vals[j]) === GAPW[i][j] ? "ok" : "bad";
      inp.oninput = () => { st.vals[j] = inp.value; HW.save(); };
    });
    if (!st.ok && !st.shown){
      const b = el("button","btn ghost","Проверить"); b.style.marginTop = "6px"; b.style.minHeight = "40px"; b.style.padding = "8px 14px";
      b.onclick = () => { if (st.vals.every(v => !v.trim())) return;
        st.tries.push(st.vals.map(v => v.trim()).join(" / "));
        st.ok = st.vals.every((v, j) => norm(v) === GAPW[i][j]);
        if (!st.ok && st.tries.length >= 2){ st.shown = true; st.vals = GAPW[i].slice(); }
        render(); };
      box.append(b);
    }
    if (st.ok) box.append(el("div","fb ok","✓ Верно"));
    else if (st.shown) box.append(el("div","fb bad","Вот ответ. Прочитай предложение вслух."));
    else if (st.tries.length) box.append(el("div","fb bad","Почти. Исправь красные слова и проверь ещё раз."));
    app.append(box);
  });
  nav(app);
}

/* ---------- step 3: my phrases (her own groups) ---------- */
let armedP = null;
function step3g(app){
  app.append(head(3, "My phrases", ["Разложи фразы на 4 группы. Какие будут группы, решаешь ты: например, по времени дня или по месту.", "Назови каждую группу. Нажми на фразу, потом на группу. Чтобы убрать фразу из группы, нажми на неё."]));
  const boxes = el("div","boxes");
  S.groups.forEach((g, gi) => {
    const b = el("div","box"+(armedP!=null?" armed":"")); b.style.cursor = "pointer";
    const nm = document.createElement("input"); nm.value = g.name; nm.placeholder = "Группа "+(gi+1)+": название";
    nm.style.cssText = "font:700 16px Georgia,serif;border:0;border-bottom:1.5px solid var(--sand);background:transparent;width:100%;padding:2px 0;margin-bottom:6px;color:var(--ink)";
    nm.onclick = e => e.stopPropagation(); nm.oninput = () => { g.name = nm.value; HW.save(); };
    b.append(nm);
    g.items.forEach(ix => { const it = el("span","got", esc(PHR[ix])); it.style.cssText = "display:block;color:var(--ink);padding:3px 0;cursor:pointer";
      it.onclick = e => { e.stopPropagation(); g.items = g.items.filter(x => x !== ix); render(); }; b.append(it); });
    b.onclick = () => { if (armedP == null) return; S.groups.forEach(x => x.items = x.items.filter(y => y !== armedP)); g.items.push(armedP); armedP = null; render(); };
    boxes.append(b);
  });
  app.append(boxes);
  const placed = new Set(S.groups.flatMap(g => g.items));
  const bank = el("div","bank"); bank.append(el("div","lab","Фразы"));
  const chips = el("div","chips");
  PHR.forEach((t, i) => { if (placed.has(i)) return;
    const c = el("button","chip"+(armedP===i?" sel":""), esc(t)); c.onclick = () => { armedP = (armedP===i?null:i); render(); }; chips.append(c); });
  if (!chips.children.length) chips.append(el("span","","Все фразы разложены! ✓"));
  bank.append(chips); app.append(bank);
  nav(app);
}

/* ---------- step 4: voice ---------- */
function step3(app){
  app.append(head(4, "My week", ["Ответь на три вопроса в одном голосовом сообщении. Используй свои фразы."]));
  const mine = S.groups.filter(g => g.items.length);
  if (mine.length){ const pl = el("div","wb"); pl.innerHTML = "<b>Твои группы</b>" + mine.map(g => '<div class="row"><span>'+esc(g.name||"Группа")+'</span>'+g.items.map(i=>esc(PHR[i])).join(" · ")+'</div>').join(""); app.append(pl); }
  const v = el("div","voice"); v.innerHTML = "<p><b>Запиши мне голосовое в Telegram</b> (1–2 минуты). Не читай с экрана: посмотри на вопросы и говори.</p>"; app.append(v);
  const st = el("div","stems"); ME.forEach((s,i) => st.append(el("p","",(i+1)+". "+esc(s)))); app.append(st);
  if (!mine.length) app.append(wordBank(false));
  const l = el("label","chk"); const c = document.createElement("input"); c.type = "checkbox"; c.checked = S.voice;
  c.onchange = () => { S.voice = c.checked; HW.save(); };
  l.append(c, document.createTextNode("Я отправила голосовое")); app.append(l);
  nav(app);
}

/* ---------- step 5: boyfriend ---------- */
function step4(app){
  app.append(head(5, "And your boyfriend?", ["Теперь напиши про своего парня: 1–2 предложения на каждый вопрос.", "Помни: he <b>has</b>, he <b>doesn't</b>, he <b>gets</b>."]));
  BF.forEach((s, i) => {
    const lb = el("label","stem", esc(s)); lb.htmlFor = "bf"+i; app.append(lb);
    const t = document.createElement("textarea"); t.id = "bf"+i; t.value = S.bf[i];
    t.placeholder = "He …"; t.oninput = () => { S.bf[i] = t.value; HW.save(); };
    app.append(t);
  });
  app.append(wordBank(false));
  nav(app);
}

/* ---------- step 6: video ---------- */
const VIDEO = "G95UnUuBaTA";
function step6(app){
  app.append(head(6, "Her day and your day", ["Посмотри видео: смотри столько, сколько тебе комфортно.", "Пока смотришь, подумай: Is her day similar to yours?"]));
  const fr = el("div",""); fr.style.cssText = "position:relative;width:100%;max-width:560px;margin:0 auto 8px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000";
  fr.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'+VIDEO+'?playsinline=1&rel=0" title="Video" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  app.append(fr);
  const op = el("p",""); op.style.cssText = "text-align:center;margin:0 0 12px;font-size:14px"; op.innerHTML = '<a href="https://www.youtube.com/watch?v='+VIDEO+'" target="_blank" rel="noopener" style="color:var(--brown)">Не открывается? Смотри на YouTube</a>'; app.append(op);
  const q = el("div","item"); q.append(el("div","",'<b>Is her day similar to yours?</b>'));
  const row = el("div","chips"); row.style.marginTop = "8px";
  ["Yes, very similar","A little","No, very different"].forEach(o => { const c = el("button","chip"+(S.like===o?" sel":""), o); c.onclick = () => { S.like = o; render(); }; row.append(c); });
  q.append(row); app.append(q);
  const v = el("div","voice"); v.innerHTML = "<p><b>Запиши второе голосовое в Telegram</b> (1 минута): расскажи про её день и сравни со своим. Не читай с экрана.</p>"; app.append(v);
  const st = el("div","stems"); ["She usually …","In the morning, she has time to …","Her day is similar to mine / different from mine because …"].forEach(x => st.append(el("p","",esc(x)))); app.append(st);
  const l = el("label","chk"); const c = document.createElement("input"); c.type = "checkbox"; c.checked = S.voice2;
  c.onchange = () => { S.voice2 = c.checked; HW.save(); };
  l.append(c, document.createTextNode("Я отправила второе голосовое")); app.append(l);
  nav(app);
}

/* ---------- final ---------- */
function stepEnd(app){
  app.append(head(0, "Well done, Маша!", ["Проверь, что ты отправила оба голосовых в Telegram. Потом нажми на кнопку."]));
  app.append(HW.sendBlock());
  const n = el("div","nav"); const b = el("button","btn ghost","← Назад"); b.onclick = () => go(S.step-1); n.append(b); app.append(n);
}

function render(){
  const pr = document.getElementById("progress"); pr.innerHTML = "";
  for (let i = 0; i < STEPS; i++) pr.append(el("span", i <= S.step ? "on" : ""));
  const app = document.getElementById("app"); app.innerHTML = "";
  [step1, step2, step3g, step3, step4, step6, stepEnd][S.step](app);
  step1.msg = null;
  HW.save();
}

HW.start({
  id: "hw1", title: "My week: do, take, make, have",
  get: () => S,
  set: z => {
    if (typeof z.step === "number") S.step = Math.max(0, Math.min(STEPS, z.step));
    if (Array.isArray(z.sort) && z.sort.length === SORT.length) S.sort = z.sort;
    if (Array.isArray(z.gaps) && z.gaps.length === GAPS.length && z.gaps.every((g, i) => g && Array.isArray(g.vals) && g.vals.length === GAPW[i].length)) S.gaps = z.gaps;
    if (Array.isArray(z.groups) && z.groups.length === NG) S.groups = z.groups.map(g => ({name: String(g.name||""), items: (g.items||[]).filter(i => i >= 0 && i < PHR.length)}));
    S.voice = !!z.voice; S.voice2 = !!z.voice2; S.like = String(z.like||"");
    if (Array.isArray(z.bf) && z.bf.length === BF.length) S.bf = z.bf.map(String);
  },
  summary: () => {
    const L = [];
    const s1 = S.sort.filter(x => x.done && !x.shown && x.tries.length === 1).length;
    L.push("Task 1 · Which verb?", `First try: ${s1} of ${SORT.length}`);
    SORT.forEach((it, i) => { const st = S.sort[i]; if (!st.tries.length) return;
      if (st.tries.length > 1 || st.shown) L.push(`✗ ${it.p}: ${st.tries.join(" → ")}${st.shown ? " (answer shown)" : ""}`); });
    L.push("", "Task 2 · Fill the gaps");
    const g1 = S.gaps.filter(g => g.ok && g.tries.length === 1).length;
    L.push(`First try: ${g1} of ${GAPS.length}`);
    GAPS.forEach((s, i) => { const st = S.gaps[i]; const line = s.replace(/\[(.+?)\]/g, "$1");
      if (!st.tries.length) L.push(`${i+1}. — not answered`);
      else L.push(`${i+1}. ${st.ok ? "✓" : "✗"} ${line} — typed: ${st.tries.join(" → ")}${st.shown ? " (answer shown)" : ""}`); });
    L.push("", "Task 3 · My phrases (her own groups)");
    const placedN = S.groups.reduce((n, g) => n + g.items.length, 0);
    L.push(`Sorted ${placedN} of ${PHR.length} phrases`);
    S.groups.forEach((g, i) => { if (g.name || g.items.length) L.push(`${g.name.trim() || "Group "+(i+1)}: ${g.items.map(x => PHR[x]).join(", ") || "—"}`); });
    L.push("", "Task 4 · My week (voice message)", S.voice ? "✓ She says she sent the voice message" : "✗ Voice message not ticked");
    L.push("", "Task 5 · My boyfriend");
    BF.forEach((s, i) => L.push(`${s} → ${S.bf[i].trim() || "—"}`));
    L.push("", "Task 6 · Video", `Her day like mine? ${S.like || "—"}`, S.voice2 ? "✓ She says she sent the second voice message" : "✗ Second voice message not ticked");
    return L.join("\n");
  },
  render
});
</script>
