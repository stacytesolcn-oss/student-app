<style>

}
@media (prefers-color-scheme: dark){ :root{
  --bg:#231815; --card:#2E211C; --ink:#F3ECDF; --muted:#BCA995; --line:#46352C;
  --brown:#F4DC96; --on-brown:#231815;
  --butter:#F4DC96; --butter-soft:#3F3422;
  --blue-soft:#253743; --blue-ink:#C1DBE8;
  --good:#9FD3AE; --good-soft:#1F3426; --warn:#F0C08E; --warn-soft:#3E2B1B;
  color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.back{color:var(--muted);font-size:.9rem;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:2.4rem} h2{font-size:1.8rem} h3{font-size:1.35rem}
p{margin:0}
.eyebrow{font-family:var(--caps);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.part{display:grid;gap:12px;padding-top:10px}

.card.ok .num{background:var(--good);color:var(--card)}

button{font:inherit;cursor:pointer;border-radius:999px;padding:10px 16px;font-weight:600;font-size:.92rem;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);min-height:44px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.on{background:var(--brown);color:var(--on-brown);border-color:var(--brown)}
button[disabled]{opacity:.45;cursor:default}
input,textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px}

.box{background:var(--blue-soft);color:var(--blue-ink);border-radius:14px;padding:10px 12px;font-size:.93rem}
.box b{display:block;font-family:var(--caps);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--brown);color:var(--on-brown);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-start;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.sheet[hidden]{display:none}
.sheet div{flex:1;max-width:560px;margin:0 auto}
.sheet b{display:block;font-size:1.05rem}

.guess:last-child{border-bottom:0}

.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--warn-soft);color:var(--warn)}
a{color:var(--brown)}
.hw-sent{background:#dff0e4;color:#2f7d4a;font-weight:700;border-radius:12px;padding:10px 14px}

<body>
<div class="wrap">
  <a class="back" href="../" data-hw-back>← My English</a>
  <div>
    <p class="eyebrow">Homework · 12 Nov lesson · about 40 min</p>
    <h1>Settling in &amp; what really matters</h1>
  </div>
  <div class="how">Three parts: your sentences from our lesson, a quick verb check, and a reading. Your answers save as you go, so you can stop and come back later.</div>
  <main id="app"></main>
</div>
<div class="sheet" id="sheet" hidden><div><b id="shW"></b><span id="shM"></span></div><button type="button" id="shX">Close</button></div>
<script src="../../../kit/hw.js"></script>
<script>
/* ---------- content ---------- */
const T1 = [
  {pre:"On the weekend, they probably try to", hint:"s___ q___ t___", post:"together.", a:["spend quality time"]},
  {pre:"When parents and kids disagree, they can", hint:"m___ i___ t___ m___", post:".", a:["meet in the middle"]},
  {pre:"Even if adults have a partner, they also", hint:"h___ a l___ o___ t___ p___", post:".", a:["have a lot on their plate"]},
  {pre:"I think Sue", hint:"s___ o___ t___ o___ e___", post:".", a:["stays on top of everything"]},
  {pre:"I think Sue and Pete try to", hint:"g___ t___ d___ i___ a r___", post:".", a:["get their ducks in a row"]},
  {pre:"I think in their family, Pete is", hint:"t___ b___", post:".", a:["the breadwinner"]},
  {pre:"Karen hasn't", hint:"s___ i___", post:"yet.", a:["settled in"]},
  {pre:"Maybe she is keeping up with the rest of the class, and she's being too", hint:"h___ o___", post:"herself.", a:["hard on"]},
  {pre:"For Karen, what", hint:"m___", post:"most is being the best student.", a:["matters"]},
  {pre:"They should", hint:"c___ o___", post:"some time to talk to Karen.", a:["carve out"]},
  {pre:"Is it a real problem, or is it just a", hint:"p___", post:"?", a:["phase","a phase"]}
];
/* ok:true = correct as it is. Otherwise: verb answers, plus a check for a retyped sentence (right form present, wrong form gone). */
const T2 = [
  {s:"I think Pete have a lot on his plate.", v:["has"], right:/\bpete has\b/, wrong:/\bpete have\b/, fix:"has"},
  {s:"She don't come inside the house.", v:["doesn't come","does not come","doesn't"], right:/\b(doesn't|does not) come\b/, wrong:/\bdon't\b/, fix:"doesn't come"},
  {s:"Adults who has a partner also have a lot on their plate.", v:["have"], right:/\bwho have\b/, wrong:/\bwho has\b/, fix:"have"},
  {s:"Sue stays on top of everything.", ok:true},
  {s:"Maybe she's down because she struggle with making new friends.", v:["struggles"], right:/\bstruggles with\b/, wrong:/\bstruggle with\b/, fix:"struggles"},
  {s:"Her parents maybe thinks about her marks.", v:["think"], right:/\bthink about\b/, wrong:/\bthinks\b/, fix:"think"},
  {s:"She doesn't want to talk about school.", ok:true},
  {s:"She have a lot on her plate.", v:["has"], right:/\bshe has\b/, wrong:/\bshe have\b/, fix:"has"},
  {s:"During the day, she stay in one area.", v:["stays"], right:/\bshe stays\b/, wrong:/\bshe stay\b/, fix:"stays"},
  {s:"My daughter thinks she's a teenager.", ok:true}
];
const A1 = [
  {s:"The writer is a mum who has a lot on her plate.", a:"T"},
  {s:"She thinks mums shouldn't need to carve out time for themselves.", a:"F"},
  {s:"She sometimes loses her patience with her daughter.", a:"T"},
  {s:"She thinks a good mum should solve every problem for her kids.", a:"F"},
  {s:"For her, spending quality time with her family matters more than a perfect home.", a:"T"}
];
const TITLE = "What I'm Really Protecting: Why I Need My Home to Ask Less of Me";
const GLOSS = {
  "strong-willed":"she knows what she wants and doesn't give up easily",
  "sassy":"answers back in a cheeky, a bit rude way",
  "declutter":"get rid of things you don't need",
  "capacity":"how much energy, time and patience you have left to give",
  "parent someone through it":"stay with your child and guide them through a hard moment",
  "figure out":"understand something after thinking about it",
  "get worked up":"get more and more upset or angry",
  "regulate yourself":"notice your strong feelings and calm yourself down",
  "left out":"not included by the others",
  "meltdown":"when a child suddenly loses control of their feelings: crying, shouting"
};
/* {shown text|glossary key} */
const ARTICLE = [
"My daughter is exhausting. There. I said it.",
"She is also amazing. Funny, smart, {strong-willed|strong-willed}, deeply emotional, and one of my favourite people on the planet. But raising her takes a lot out of me. Especially at the weekend.",
"I'm the kind of person who needs quiet. I need to carve out little pockets of peace during the day. And I happen to be raising a child who can fill every inch of a room with her energy.",
"This is one of my favourite things about her. She is confident and full of spirit. But she can also be {sassy|sassy}, argue about everything, or get stuck in a bad mood. Is it just a phase? Maybe. This girl can argue about the colour of the sky. “It's not blue, Mum. It's indigo.”",
"On many days, by the evening I've helped her with her emotions, answered her questions (2,140 of them, to be exact), stopped the arguments, set boundaries, and tried to be the calm person in the room. And then I am done. Done-with-the-day tired. My soul feels tired, tired.",
"On those days, I don't even try to stay on top of the housework. The mail is still on the kitchen table. There are dishes in the sink. A sweatshirt stays on the back of a chair. I've learned to let it just be until tomorrow.",
"That's why I keep my home simple. I've spent years {decluttering|declutter} and getting my ducks in a row, so the house needs very little effort from me. I don't need it to stay perfect when life gets hard. I need it to be easy to get back to normal when life gets easier again.",
"My energy is a resource, and I want to make the most of it.",
"When my daughter is really down, I don't just want enough patience to get through it without losing my mind. I want enough {capacity|capacity} left to actually {parent her through it|parent someone through it}. I want to help her {figure out|figure out} what she's feeling and why. I want to give her words for emotions she doesn't understand yet. I want to help her recognise when she's {getting worked up|get worked up} and teach her what she can do when that happens.",
"And maybe most importantly, I want to show her what {regulating yourself|regulate yourself} actually looks like. Which means I have to be able to regulate myself, too. I have to notice when I'm getting frustrated and take a breath. Sometimes I have to say, “I need a minute,” and walk away, instead of answering from the most stressed, overwhelmed version of myself.",
"I don't do any of this perfectly. I lose my patience. I raise my voice. Sometimes, five minutes later, I have to say sorry. I try not to be too hard on myself. We both learn from our mistakes.",
"I want to teach her these things now, before she becomes a teenager. Because one day I won't always be there. She'll go to sleepovers and playdates. She'll struggle with friendships, and I won't be standing next to her to help. She'll feel angry, disappointed, embarrassed or {left out|left out}, and she'll have to decide what to do with those feelings on her own.",
"That takes a lot more from me than just getting her through the day. And I can't do it well if I already have so much on my plate. If I'm 95% full before her {meltdown|meltdown} even starts, I don't have much room left to be the parent I want to be.",
"Some things are out of my control. I can't control how hard a Saturday will be. I can't stop every argument. But I can control how much stuff I own, so my home doesn't take even more of my energy.",
"I want something left when my teenager wants to talk to me and actually tell me something about his life. I want to spend quality time with my husband at the end of the day and actually be present for it. And it's not just about carving out some me time. I want to have enough energy left to enjoy it: to go for a walk, read a book, or simply do nothing.",
"I want my home to take as little of me as possible, so I have more of myself left for the people who matter most.",
"So here's my question for you: what do you wish you had more of yourself left for?"
];
const ORIGINAL = "https://doitintentionally.substack.com/p/what-im-really-protecting-why-i-need";
const PHRASES = [
  ["have a lot on her plate", /\bon (her|my|their|his) plate\b/],
  ["stay on top of", /\bon top of\b/],
  ["carve out some me time", /\bcarv(e|es|ed|ing) out\b/],
  ["out of her control", /\bout of (her|my|their|his) control\b/],
  ["set boundaries", /\bboundar(y|ies)\b/],
  ["what matters most", /\bmatter(s|ed)? most\b/],
  ["overwhelmed", /\boverwhelm/],
  ["be too hard on herself", /\bhard on (herself|myself|themselves|himself)\b/]
];
const B2 = ["One thing I agree with or already knew:","One thing that surprised me:","One thing I still have a question about:"];
const C1STARTERS = ["The writer has a lot on her plate because…","On hard days, she doesn't…","What matters most to her is…"];

/* ---------- state ---------- */
const S = {
  t1: T1.map(()=>({val:"",tries:[],ok:false})),
  t2: T2.map(()=>({pick:"",picks:[],val:"",tries:[],ok:false})),
  a1: A1.map(()=>""), a2:["",""], reading:false, b1:false,
  b2: B2.map(()=>""), c1:"", c2:false
};
const norm = s => String(s||"").toLowerCase().replace(/[‘’ʼ`]/g,"'").replace(/[.!?,;:]+$/,"").replace(/\s+/g," ").trim();
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const save = () => { try{ HW.save(); }catch(e){} };
const MAX = 2; // tries before the answer is shown

/* ---------- task 1 ---------- */
function task1(app){
  const part = el("section","part");
  part.append(el("p","eyebrow","Part 1"), el("h2",null,"Your good sentences"),
    el("p",null,"These are your sentences from our lesson. Type the missing phrase. You can see the first letter of each word."));
  T1.forEach((it,i)=>{
    const st=S.t1[i], done=st.ok||st.tries.length>=MAX, card=el("div","card"+(st.ok?" ok":""));
    const top=el("div","top"); top.append(el("span","num",i+1));
    const p=el("p","sent"); p.append(document.createTextNode(it.pre+" "), el("span","hint",it.hint), document.createTextNode(it.post==="."||it.post==="?"?it.post:" "+it.post));
    top.append(p); card.append(top);
    const inp=el("input"); inp.value=st.val; inp.placeholder=it.hint; inp.disabled=done; inp.autocapitalize="off"; inp.autocomplete="off"; inp.spellcheck=false;
    inp.oninput=()=>{st.val=inp.value;save();};
    const check=()=>{ const v=norm(st.val); if(!v||done) return; st.tries.push(st.val.trim()); st.ok=it.a.includes(v); render(); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } };
    card.append(inp);
    if(!done){ const b=el("button",null,"Check"); b.type="button"; b.onclick=check; const r=el("div","row"); r.append(b); card.append(r); }
    if(st.tries.length){
      if(st.ok) card.append(el("div","fb good","✓ Yes! "+it.a[it.a.length-1]));
      else if(done) card.append(el("div","fb bad","The phrase is: "+it.a[it.a.length-1]+". Look at the first letters again: "+it.hint));
      else card.append(el("div","fb bad","Not quite — check the first letters and try again."));
    }
    part.append(card);
  });
  app.append(part);
}

/* ---------- task 2 ---------- */
function task2(app){
  const part = el("section","part");
  part.append(el("p","eyebrow","Part 2"), el("h2",null,"Correct or could be improved?"),
    el("p",null,"These are your sentences from our lesson. Some are correct. Some can be improved. Look only at the verb after he / she / Pete / adults / parents. Choose Correct or Could be improved, and fix the ones that need it."));
  T2.forEach((it,i)=>{
    const st=S.t2[i], card=el("div","card"+(st.ok?" ok":""));
    const top=el("div","top"); top.append(el("span","num",i+1), el("p","sent",it.s)); card.append(top);
    const pickDone = it.ok ? (st.ok || st.picks.length>=MAX) : (st.pick==="i" || st.picks.length>=MAX);
    const seg=el("div","seg");
    [["c","Correct"],["i","Could be improved"]].forEach(([k,lab])=>{
      const b=el("button",null,lab); b.type="button";
      if(st.pick===k) b.className = ((k==="c")===!!it.ok) ? "right" : "wrong";
      b.disabled = pickDone;
      b.onclick=()=>{ st.picks.push(k); st.pick=k; if(it.ok && k==="c") st.ok=true; render(); };
      seg.append(b);
    });
    card.append(seg);
    if(it.ok){
      if(st.ok) card.append(el("div","fb good","✓ Yes — this one is correct."));
      else if(st.picks.length>=MAX) card.append(el("div","fb bad","This one is correct as it is: "+it.s));
      else if(st.picks.length) card.append(el("div","fb bad","Look at the verb again. Is there really a problem?"));
    } else {
      const reachedFix = st.pick==="i" || st.picks.length>=MAX;
      if(!reachedFix && st.picks.length) card.append(el("div","fb bad","Look at the verb again — something can be improved."));
      if(reachedFix){
        const fixDone = st.ok || st.tries.length>=MAX;
        if(st.pick!=="i") card.append(el("div","fb bad","This one can be improved. Fix the verb."));
        else if(!st.tries.length) card.append(el("p","muted","Type the better verb, or the whole sentence."));
        const inp=el("input"); inp.value=st.val; inp.disabled=fixDone; inp.placeholder="the verb or the whole sentence"; inp.autocapitalize="off"; inp.autocomplete="off"; inp.spellcheck=false;
        inp.oninput=()=>{st.val=inp.value;save();};
        const check=()=>{ const v=norm(st.val); if(!v||fixDone) return; st.tries.push(st.val.trim());
          st.ok = it.v.map(norm).includes(v) || (v.split(" ").length>2 && it.right.test(v) && !it.wrong.test(v)); render(); };
        inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } };
        card.append(inp);
        if(!fixDone){ const b=el("button",null,"Check"); b.type="button"; b.onclick=check; const r=el("div","row"); r.append(b); card.append(r); }
        if(st.tries.length){
          if(st.ok) card.append(el("div","fb good","✓ Yes! "+it.fix));
          else if(fixDone) card.append(el("div","fb bad","Better: "+it.fix+". Who is it? One person → verb + s; more people → no s."));
          else card.append(el("div","fb bad","Not quite. Who is doing it — one person or more? Try again."));
        }
      }
    }
    part.append(card);
  });
  app.append(part);
}

/* ---------- task 3 ---------- */
function phraseBox(text){
  const box=el("div","box"); box.append(el("b",null,"Phrase box"));
  const chips=el("div","chips"), t=norm(text||"");
  PHRASES.forEach(([lab,re])=>chips.append(el("span","chip"+(text!=null&&re.test(t)?" used":""),lab)));
  box.append(chips); return box;
}
function starters(list){ const u=el("ul","starters"); list.forEach(s=>u.append(el("li",null,s))); return u; }
function textArea(get,set,ph,rows){ const ta=el("textarea"); ta.value=get(); if(ph) ta.placeholder=ph; if(rows) ta.rows=rows; ta.oninput=()=>{set(ta.value);save();if(ta._after)ta._after();}; return ta; }
function showGloss(key){ $("shW").textContent=key; $("shM").textContent=GLOSS[key]; $("sheet").hidden=false; }

function task3(app){
  const part = el("section","part");
  part.append(el("p","eyebrow","Part 3 · Reading"), el("h2",null,"“What I'm Really Protecting”"));

  /* Stage A */
  part.append(el("h3",null,"Before you read"));
  const a1=el("div","card"); a1.append(el("p",null,"A1. Read the title: “"+TITLE+"”. Guess: will the article say this?"));
  A1.forEach((it,i)=>{
    const r=el("div","guess"); r.append(el("span",null,(i+1)+". "+it.s));
    const seg=el("div","seg"); seg.style.minWidth="120px";
    [["T","Yes"],["F","No"]].forEach(([k,lab])=>{ const b=el("button",null,lab); b.type="button"; if(S.a1[i]===k) b.className="on"; b.disabled=S.reading;
      b.onclick=()=>{S.a1[i]=k;render();}; seg.append(b); });
    r.append(seg); a1.append(r);
  });
  part.append(a1);

  const a2=el("div","card");
  a2.append(el("p",null,"A2. What would you like to find out from the article? Write 2 questions. You can use the question starters and the phrases in the box."),
    starters(["How does she…?","What does she do when…?","Does she ever…?"]), phraseBox(null));
  [0,1].forEach(i=>a2.append(textArea(()=>S.a2[i],v=>S.a2[i]=v,"Question "+(i+1),2)));
  part.append(a2);

  if(!S.reading){
    const r=el("div","row"), b=el("button",null,"I'm ready to read →"); b.type="button";
    const all=S.a1.every(Boolean); b.disabled=!all;
    b.onclick=()=>{ S.reading=true; render(); };
    r.append(b); if(!all) r.append(el("span","muted","Answer all 5 guesses first."));
    part.append(r); app.append(part); return;
  }

  /* Stage B */
  part.append(el("h3",null,"While you read"));
  part.append(el("div","how","Don't worry if you don't know every word. Try to figure out the meaning from the context. For some tricky words I've added a short definition. Tap a highlighted word to see it."));
  const cap=el("div","box"); cap.append(el("b",null,"capacity"), document.createTextNode("how much energy, time and patience you have left to give")); part.append(cap);
  const art=el("article","article"); art.append(el("h3",null,TITLE));
  ARTICLE.forEach(par=>{ const p=el("p");
    par.split(/(\{[^}]+\})/).forEach(bit=>{ const m=bit.match(/^\{([^|]+)\|([^}]+)\}$/);
      if(m){ const s=el("span","gl",m[1]); s.setAttribute("role","button"); s.tabIndex=0; s.onclick=()=>showGloss(m[2]); s.onkeydown=e=>{if(e.key==="Enter")showGloss(m[2]);}; p.append(s); }
      else if(bit) p.append(document.createTextNode(bit)); });
    art.append(p); });
  const src=el("p","muted"); src.style.fontSize=".9rem"; src.append(document.createTextNode("Adapted from Do It Intentionally (Substack), 4 Oct 2026. "));
  const a=el("a",null,"Read the original article →"); a.href=ORIGINAL; a.target="_blank"; a.rel="noopener"; src.append(a); art.append(src);
  part.append(art);

  const b1=el("div","card"); b1.append(el("p",null,"B1. Go back to your answers in A1. Were you right?"));
  if(!S.b1){ const b=el("button",null,"Check my guesses"); b.type="button"; b.onclick=()=>{S.b1=true;render();}; const r=el("div","row"); r.append(b); b1.append(r); }
  else { let n=0; A1.forEach((it,i)=>{ const right=S.a1[i]===it.a; if(right) n++;
      const r=el("div","guess"); r.append(el("span",null,(i+1)+". "+it.s));
      r.append(el("span","tag "+(right?"good":"bad"),(it.a==="T"?"Yes, it says this":"No, it doesn't")+(right?" ✓":"")));
      b1.append(r); });
    b1.append(el("div","fb "+(n>=3?"good":"bad"),"You guessed "+n+" of "+A1.length+" right.")); }
  part.append(b1);

  const b2=el("div","card"); b2.append(el("p",null,"B2. Your reaction. Write one short sentence for each."));
  B2.forEach((lab,i)=>{ b2.append(el("p","muted",lab), textArea(()=>S.b2[i],v=>S.b2[i]=v,null,2)); });
  part.append(b2);

  /* Stage C */
  part.append(el("h3",null,"Sum it up"));
  const c1=el("div","card");
  c1.append(el("p",null,"C1. Write a short summary of the article (4–5 sentences) in your own words. Use at least 3 phrases from the box. You can start with these:"), starters(C1STARTERS));
  let pb=phraseBox(S.c1); c1.append(pb);
  const cnt=el("p","muted"); const upd=()=>{ const t=norm(S.c1), n=PHRASES.filter(([,re])=>re.test(t)).length; cnt.textContent="Phrases from the box: "+n+(n>=3?" ✓":" of 3"); const nb=phraseBox(S.c1); pb.replaceWith(nb); pb=nb; };
  const ta=textArea(()=>S.c1,v=>S.c1=v,"Your summary",6); ta._after=upd; c1.append(ta, cnt); upd();
  part.append(c1);

  const c2=el("div","card");
  c2.append(el("p",null,"C2. Optional: record a short voice message for me in Telegram. Don't read aloud — just talk. You can use these starters:"),
    starters(["Like the writer, I…","I can tell it's just a phase when…, but it really matters when…"]));
  const b=el("button",S.c2?"on":"ghost",S.c2?"✓ I sent a voice message":"I sent a voice message"); b.type="button";
  b.onclick=()=>{S.c2=!S.c2;render();}; const r=el("div","row"); r.append(b); c2.append(r);
  part.append(c2);

  app.append(part);
}

/* ---------- page ---------- */
function render(){
  const app=$("app"); app.innerHTML="";
  task1(app); task2(app); task3(app);
  const end=el("section","part");
  if(S.reading){ end.append(el("p",null,"Finished? Send it to me — you can still come back and look at it.")); end.append(HW.sendBlock({lang:"en"})); }
  app.append(end);
  save();
}
$("shX").onclick=()=>{ $("sheet").hidden=true; };

/* ---------- what Stacy reads ---------- */
const tries = t => t.length ? t.map(x=>"“"+x+"”").join(" → ")+" ("+t.length+" "+(t.length===1?"try":"tries")+")" : "not answered";
function summary(){
  const L=[];
  const n1=S.t1.filter(s=>s.ok&&s.tries.length===1).length, d1=S.t1.filter(s=>s.ok).length;
  L.push("Task 1 · Her sentences: gap-fill", "Got "+d1+" of "+T1.length+" ("+n1+" first try)");
  T1.forEach((it,i)=>{ const s=S.t1[i]; L.push((i+1)+". "+it.a[it.a.length-1]+" → "+(s.ok?"✓ ":s.tries.length?"✗ ":"")+tries(s.tries)); });
  L.push("");
  const d2=S.t2.filter(s=>s.ok).length, fixes=T2.filter(t=>!t.ok).length;
  const spotted=T2.filter((t,i)=>!t.ok && S.t2[i].picks[0]==="i").length;
  L.push("Task 2 · Third person: correct or improve", "Right in the end: "+d2+" of "+T2.length+" · spotted "+spotted+" of "+fixes+" mistakes on the first tap");
  T2.forEach((it,i)=>{ const s=S.t2[i], pk=s.picks.map(p=>p==="c"?"Correct":"Could be improved").join(" → ")||"not answered";
    if(it.ok) L.push((i+1)+". "+it.s+" [correct] → "+(s.ok?"✓ ":s.picks.length?"✗ ":"")+pk);
    else L.push((i+1)+". "+it.s+" [→ "+it.fix+"] → "+(s.ok?"✓ ":(s.picks.length||s.tries.length)?"✗ ":"")+pk+(s.tries.length?" · fix: "+tries(s.tries):"")); });
  L.push("");
  const right=A1.filter((it,i)=>S.a1[i]===it.a).length;
  L.push("Task 3 · Reading “What I'm Really Protecting”", S.reading?"Guessed "+right+" of "+A1.length+" before reading":"Not started reading yet");
  A1.forEach((it,i)=>{ const g=S.a1[i]; L.push("A1."+(i+1)+" "+it.s+" → "+(g?(g==="T"?"Yes":"No")+(g===it.a?" ✓":" ✗"):"—")); });
  S.a2.forEach((q,i)=>L.push("A2 question "+(i+1)+": "+(q.trim()||"—")));
  B2.forEach((lab,i)=>L.push("B2 "+lab+" "+(S.b2[i].trim()||"—")));
  const t=norm(S.c1), used=PHRASES.filter(([,re])=>re.test(t)).map(([l])=>l);
  L.push("C1 summary ("+used.length+" phrases: "+(used.join(", ")||"none")+"):", S.c1.trim()||"—");
  L.push("C2 voice message: "+(S.c2?"she says she sent it":"not marked"));
  return L.join("\n");
}

HW.start({
  id:"hw1", title:"Settling in & what really matters (12 Nov)",
  get:()=>S,
  set:(z)=>{
    if(Array.isArray(z.t1)&&z.t1.length===T1.length) S.t1=z.t1;
    if(Array.isArray(z.t2)&&z.t2.length===T2.length) S.t2=z.t2;
    if(Array.isArray(z.a1)&&z.a1.length===A1.length) S.a1=z.a1;
    if(Array.isArray(z.a2)&&z.a2.length===2) S.a2=z.a2.map(String);
    if(Array.isArray(z.b2)&&z.b2.length===B2.length) S.b2=z.b2.map(String);
    S.reading=!!z.reading; S.b1=!!z.b1; S.c1=String(z.c1||""); S.c2=!!z.c2;
  },
  summary, render
});
